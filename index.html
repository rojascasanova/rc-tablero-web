function renameArea(a){
  askText('Renombrar proyecto (vacío para eliminar):', a.name, name=>{
    if(name===null) return;
    if(name){ a.name=name; render(); }
    else if(confirm('¿Eliminar el proyecto "'+a.name+'"?')){
      data.areas=data.areas.filter(x=>x!==a);
      if(data.ui.currentAreaId===a.id) data.ui.currentAreaId=data.areas[0]?.id;
      render();
    }
  });
}
// Reemplazo de prompt() que sí funciona dentro de la app de escritorio (Electron).
function askText(titulo, valorInicial, cb){
  const ov=el('div',{class:'modal-ov',onmousedown:e=>{ if(e.target===ov){ ov.remove(); } }});
  const inp=el('input',{class:'ask-in',type:'text',value:valorInicial||''});
  const done=(ok)=>{ const v=inp.value.trim(); ov.remove(); cb(ok? v : null); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') done(true); else if(e.key==='Escape') done(false); });
  ov.append(el('div',{class:'modal ask-modal'},
    el('h4',{text:titulo}),
    inp,
    el('div',{class:'m-row'},
      el('button',{onclick:()=>done(false)},'Cancelar'),
      el('button',{class:'primary',onclick:()=>done(true)},'Aceptar'))
  ));
  document.body.append(ov);
  setTimeout(()=>{ inp.focus(); inp.select(); },40);
}

function addColumn(a){
  askText('Nombre de la sección:', '', name=>{
    if(!name) return;
    a.columns.push({id:uid(),name:name,tasks:[]}); render();
  });
}
function quickAddPrompt(){
  const a=curArea();
  if(data.ui.view==='inbox'||!a){ askText('Añadir a la bandeja:', '', v=>{ if(v){ data.inbox.push({id:uid(),text:v,done:false,priority:0,due:null}); render(); } }); return; }
  askText('Nueva tarea en "'+a.name+' · '+a.columns[0].name+'":', '', v=>{ if(v){ a.columns[0].tasks.push({id:uid(),text:v,done:false,priority:0,due:null}); render(); } });
}
function openJsonModal(mode){
  const ov=el('div',{class:'modal-ov',onclick:e=>{ if(e.target===ov) ov.remove(); }});
  const ta=el('textarea',{spellcheck:'false'});
  const row=el('div',{class:'m-row'});
  let title, hint;
  if(mode==='export'){
    title='Copiar tablero · JSON'; ta.value=JSON.stringify(data,null,2);
    hint='Este JSON tiene todas tus tareas. Cópialo y pégamelo en el chat para que trabaje sobre él, o descárgalo como archivo.';
    const copyBtn=el('button',{class:'primary',onclick:()=>{
      ta.select();
      const done=()=>{ copyBtn.textContent='✓ Copiado'; setTimeout(()=>copyBtn.textContent='Copiar',1600); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ try{document.execCommand('copy');done();}catch(_){}} ); }
      else { try{document.execCommand('copy');done();}catch(_){} }
    }},'Copiar');
    row.append(el('button',{onclick:()=>exportData()},'Descargar .json'),
               el('button',{onclick:()=>ov.remove()},'Cerrar'), copyBtn);
    setTimeout(()=>ta.select(),60);
  } else {
    title='Pegar tablero · JSON'; ta.placeholder='Pega aquí el JSON que te devuelvo…';
    hint='Reemplaza el tablero actual con el JSON que pegues. Si quieres conservar el estado previo, usa “Copiar JSON” antes.';
    const loadBtn=el('button',{class:'primary',onclick:()=>{
      try{
        const d=JSON.parse(ta.value);
        if(!d||!d.areas) throw 0;
        data=d;
        normalizeData();
        ov.remove(); render(); save();
        if(CLOUD_READY) cloudDot('saving');
      }catch(_){ loadBtn.textContent='JSON inválido'; setTimeout(()=>loadBtn.textContent='Cargar',1600); }
    }},'Cargar');
    row.append(el('button',{onclick:()=>ov.remove()},'Cerrar'), loadBtn);
  }
  ov.append(el('div',{class:'modal'}, el('h4',{text:title}), ta, row, el('div',{class:'hint',text:hint})));
  document.body.append(ov);
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:'rc-tablero-'+todayStr()+'.json'}); document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(){
  const inp=el('input',{type:'file',accept:'.json,application/json'});
  inp.addEventListener('change',()=>{
    const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.areas){ data=d; if(!data.ui.currentAreaId)data.ui.currentAreaId=data.areas[0]?.id; render(); } else alert('Archivo no válido.'); }catch(e){ alert('No se pudo leer el archivo.'); } };
    r.readAsText(f);
  });
  inp.click();
}

/* ============ RELOJ ============ */
function tick(){
  const now=new Date();
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const wk=(()=>{const d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);})();
  document.getElementById('clkDay').textContent=dias[now.getDay()];
  document.getElementById('clkDate').textContent=now.getDate()+' '+meses[now.getMonth()];
  document.getElementById('clkTime').textContent=now.toTimeString().slice(0,8)+'  ·  SEM '+wk;
}

/* ============ NUBE (Supabase) ============ */
let SB=null, CLOUD_READY=false, CLOUD_USER=null, CLOUD_PUSHING=false;
const CLIENT_ID = Math.random().toString(36).slice(2,10);   // para ignorar mis propios cambios
let cloudPushTimer=null, lastCloudRev=null;

function cloudInit(){
  if(SB) return SB;
  if(!window.supabase || !window.RC_SUPABASE_URL){ return null; }
  SB = window.supabase.createClient(window.RC_SUPABASE_URL, window.RC_SUPABASE_ANON, {
    auth:{ persistSession:true, autoRefreshToken:true }
  });
  return SB;
}

async function cloudLoad(){
  if(!SB) return false;
  try{
    const { data:row, error } = await SB.from('tablero_estado')
      .select('data,actualizado_en').eq('id',1).single();
    if(error){ console.warn('cloudLoad', error.message); cloudAviso('error'); return false; }
    const d = row && row.data;
    if(d && d.areas && d.areas.length){
      // ¿este equipo tiene cambios que nunca confirmó la nube?
      const pend = pendienteDesde();
      const nube = row.actualizado_en ? Date.parse(row.actualizado_en) : 0;
      if(pend && pend > nube){
        // lo de aquí es más nuevo: NO lo pisamos, lo subimos.
        console.info('cambios locales sin subir, más nuevos que la nube: los subo');
        CLOUD_READY=true;
        await cloudPushNow(true);
        return false;
      }
      if(pend && pend <= nube){
        // la nube va más adelante: guardo una copia de lo local antes de reemplazar
        try{ localStorage.setItem('rc_respaldo_v1', localStorage.getItem(KEY)||''); }catch(e){}
        cloudAviso('pisado');
      } else {
        limpiarPendiente();
      }
      data = d;                    // usar lo de la nube
      // re-normalizar (misma lógica de load())
      normalizeData();
      lastCloudRev = d._rev || null;
      return true;
    }
    // la nube está vacía: subir lo que haya local como punto de partida
    await cloudPushNow(true);
    return false;
  }catch(e){ console.warn('cloudLoad ex', e); cloudAviso('error'); return false; }
}

function cloudPush(){
  if(!CLOUD_READY || !SB){ if(!SB) cloudAviso('local'); return; }
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>cloudPushNow(false), 400);
}

/* Reintento automático: si la nube falla, no se pierde nada. Se vuelve a
   intentar cada vez más espaciado, hasta un minuto. */
let reintentoT=null, reintentoN=0;
function programarReintento(){
  clearTimeout(reintentoT);
  const espera=Math.min(60000, 4000*Math.pow(2, Math.min(reintentoN,4)));
  reintentoN++;
  reintentoT=setTimeout(()=>cloudPushNow(false), espera);
}

async function cloudPushNow(initial){
  if(!SB || !CLOUD_READY) return;
  if(CLOUD_PUSHING) { cloudPush(); return; }
  CLOUD_PUSHING=true;
  try{
    data._rev = CLIENT_ID + ':' + Date.now();
    lastCloudRev = data._rev;
    const payload = { data: data, actualizado_en: new Date().toISOString() };
    if(CLOUD_USER) payload.por_user = CLOUD_USER;
    const { error } = await SB.from('tablero_estado').update(payload).eq('id',1);
    if(error){
      console.warn('cloudPush', error.message);
      cloudAviso('error', error.message); programarReintento();
    } else {
      limpiarPendiente(); reintentoN=0; clearTimeout(reintentoT);
      cloudAviso(null); cloudDot('ok');
    }
  }catch(e){
    console.warn('cloudPushNow ex', e);
    cloudAviso('error', e && e.message); programarReintento();
  }
  CLOUD_PUSHING=false;
}

/* Aviso FIJO en pantalla mientras el tablero no esté guardando en la nube.
   El punto de antes duraba 1,8 s y era imposible darse cuenta. */
let CLOUD_ALERTA=null;
function cloudAviso(tipo, detalle){
  const viejo=document.getElementById('cloudAlerta');
  if(!tipo){ CLOUD_ALERTA=null; if(viejo) viejo.remove(); return; }
  CLOUD_ALERTA=tipo;
  const txt={
    local  : ['Sin conexión con la nube',
              'Lo que escribas queda solo en este equipo. Toca aquí para reintentar.'],
    error  : ['No se está guardando en la nube',
              'Tus cambios están a salvo en este equipo y se reintenta solo. Toca para reintentar ahora.'],
    pisado : ['Se cargó la versión de la nube',
              'Este equipo tenía cambios sin subir, más antiguos. Guardé una copia por si acaso.']
  }[tipo] || ['Problema con la nube',''];
  const nodo = viejo || el('div',{id:'cloudAlerta',class:'cloud-alerta',
    onclick:()=>{ if(tipo==='pisado'){ cloudAviso(null); return; }
                  reintentoN=0; CLOUD_READY=true; cloudPushNow(false); }});
  nodo.innerHTML='';
  nodo.append(el('b',{text:'⚠ '+txt[0]}), el('small',{text:txt[1]+(detalle?(' · '+detalle):'')}));
  if(!viejo) document.body.append(nodo);
}

/* Al cerrar o esconder la pestaña, subir de inmediato lo que quede pendiente:
   en el teléfono uno cambia de app y la página se congela a los pocos segundos. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden' && pendienteDesde()){
    clearTimeout(cloudPushTimer); cloudPushNow(false);
  }
});
window.addEventListener('pagehide',()=>{ if(pendienteDesde()){ clearTimeout(cloudPushTimer); cloudPushNow(false); } });

function cloudSubscribe(){
  if(!SB) return;
  SB.channel('estado-rc')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'tablero_estado' }, payload=>{
      try{
        const d = payload.new && payload.new.data;
        if(!d) return;
        // ignorar mis propios cambios
        if(d._rev && d._rev === lastCloudRev) return;
        if(d._rev && d._rev.split(':')[0] === CLIENT_ID) return;
        // no pisar mientras estoy editando algo
        if(isEditing && isEditing()) return;
        if(document.querySelector('.modal-ov')) return;
        data = d; normalizeData(); render(); cloudDot('sync');
      }catch(e){ console.warn('realtime', e); }
    })
    .subscribe();
}

/* indicador chico de estado de guardado */
function cloudDot(state){
  let d=document.getElementById('cloudDot');
  if(!d){ d=el('div',{id:'cloudDot',class:'cloud-dot'}); document.body.append(d); }
  const map={ok:['●','guardado en la nube','var(--today)'],err:['●','error al guardar','var(--p1)'],sync:['↻','actualizado desde la nube','var(--p2)'],saving:['●','guardando…','var(--faint)']};
  const m=map[state]||map.ok; d.textContent=m[0]+' '+m[1]; d.style.color=m[2];
  d.classList.add('show'); clearTimeout(d._t); d._t=setTimeout(()=>d.classList.remove('show'),1800);
}

/* ---- pantalla de login ---- */
function showLogin(msg){
  let ov=document.getElementById('loginOv');
  if(ov) ov.remove();
  ov=el('div',{class:'login-ov',id:'loginOv'});
  const box=el('div',{class:'login-box'});
  const email=el('input',{class:'login-in',type:'email',placeholder:'correo',autocomplete:'username'});
  const pass=el('input',{class:'login-in',type:'password',placeholder:'contraseña',autocomplete:'current-password'});
  const err=el('div',{class:'login-err'});
  const btn=el('button',{class:'login-btn'},'Entrar');
  const doLogin=async ()=>{
    err.textContent=''; btn.textContent='Entrando…'; btn.disabled=true;
    try{
      const { data:res, error } = await SB.auth.signInWithPassword({ email:email.value.trim(), password:pass.value });
      if(error){ err.textContent='Correo o contraseña incorrectos.'; btn.textContent='Entrar'; btn.disabled=false; return; }
      CLOUD_USER = res.user.id;
      ov.remove();
      await afterLogin();
    }catch(e){ err.textContent='No se pudo conectar. Revisa tu internet.'; btn.textContent='Entrar'; btn.disabled=false; }
  };
  btn.addEventListener('click', doLogin);
  pass.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  email.addEventListener('keydown', e=>{ if(e.key==='Enter') pass.focus(); });
  box.append(
    el('div',{class:'login-brand'}, el('span',{class:'login-rc',text:'rc'}), el('div',{class:'login-t'},'rojas.casanova', el('small',{text:'tablero'}))),
    el('div',{class:'login-sub',text:'Inicia sesión para entrar a tu tablero'}),
    email, pass, err, btn
  );
  if(msg) box.append(el('div',{class:'login-note',text:msg}));
  ov.append(box); document.body.append(ov);
  setTimeout(()=>email.focus(),50);
}

async function afterLogin(){
  CLOUD_READY=false;
  const got = await cloudLoad();      // trae datos de la nube (o sube los locales)
  CLOUD_READY=true;
  render();
  cloudSubscribe();
  if(pendienteDesde()) cloudPushNow(false);   // quedó algo sin subir: súbelo ya
  cloudDot(got?'sync':'ok');
  // arrancar puentes/relojes
  ensureTimerWidget();
}

async function boot(){
  load();                 // carga cache local + normaliza (para tener algo mientras conecta)
  const sb = cloudInit();
  if(!sb){
    // sin librería/config: modo local (respaldo). Antes esto pasaba en
    // silencio y uno creía estar guardando en la nube sin estarlo.
    render(); cloudAviso('local'); return;
  }
  const { data:sess } = await SB.auth.getSession();
  if(sess && sess.session){
    CLOUD_USER = sess.session.user.id;
    render();               // muestra algo mientras trae la nube
    await afterLogin();
  } else {
    render();               // el board queda detrás del login
    showLogin();
  }
}

async function cloudLogout(){
  if(!SB){ return; }
  if(!confirm('¿Cerrar sesión? Tendrás que ingresar tu correo y contraseña de nuevo.')) return;
  try{ await SB.auth.signOut(); }catch(e){}
  CLOUD_READY=false; CLOUD_USER=null;
  showLogin();
}

/* ---- Sello de versión en la barra lateral ---- */
(function(){
  const s=document.getElementById('verStamp');
  if(!s) return;
  const v=(window.rcApp&&window.rcApp.version)||null;
  if(v){
    s.textContent='tablero · v'+v;
    s.title='Versión instalada '+v+' · clic para buscar actualización';
    s.style.cursor='pointer';
    s.addEventListener('click',()=>{ if(window.rcApp&&window.rcApp.buscarActualizacion) window.rcApp.buscarActualizacion(); });
  } else {
    s.textContent='tablero · web · v'+(window.RC_VERSION||'?');
    s.title='Versión web '+(window.RC_VERSION||'?');
    // si el auto-refresco detectó que hay una más nueva y el teléfono
    // insiste en darnos la vieja, lo decimos y ofrecemos reintentar
    setTimeout(function(){
      if(!window.RC_CACHE_PEGADA) return;
      s.textContent='tablero · web · v'+(window.RC_VERSION||'?')+' · hay v'+window.RC_CACHE_PEGADA;
      s.style.color='var(--today)';
      s.style.cursor='pointer';
      s.title='Tu teléfono sigue mostrando la versión guardada. Toca aquí para forzar la nueva.';
      s.addEventListener('click',function(){
        location.replace(location.pathname+'?rcv='+encodeURIComponent(window.RC_CACHE_PEGADA)+'&t='+Date.now());
      });
    },2500);
  }
})();

/* ---- Menú lateral en teléfono ---- */
function toggleNav(){ document.body.classList.toggle('nav-open'); }
// ¿pantalla táctil? (teléfono/tablet). Se usa para no activar el arrastre.
// En la app de escritorio SIEMPRE devuelve false: ahí el arrastre debe seguir igual
// que siempre, aunque el computador tenga pantalla táctil.
function esTactil(){
  try{
    if(window.rcApp) return false;                     // app de escritorio → nunca táctil
    if(window.innerWidth > 760) return false;          // pantalla grande → nunca táctil
    return matchMedia('(pointer:coarse)').matches;
  }catch(e){ return false; }
}
function cerrarNav(){ document.body.classList.remove('nav-open'); }
document.addEventListener('click',e=>{
  if(!document.body.classList.contains('nav-open')) return;
  const sb=document.getElementById('sidebar');
  const btn=document.getElementById('navBtn');
  if(e.target===btn||(btn&&btn.contains(e.target))) return;
  // al tocar una opción del menú, o fuera de él, se cierra
  if(!sb||!sb.contains(e.target)||e.target.closest('.nav-item')) cerrarNav();
});

tick(); setInterval(tick,1000);

// Puente con la ventana flotante del timer (solo cuando corre como app Electron)
if(window.rcTimer && window.rcTimer.onCommand){
  window.rcTimer.onCommand(function(cmd){
    if(cmd==='pause') timerPauseResume();
    else if(cmd==='stop') timerStop();
    else if(cmd==='goto'){ const t=data.ui.timer; if(t){ const r=findColById(t.colId); if(r) goToProject(r.area,r.col); if(window.rcTimer.focusMain) window.rcTimer.focusMain(); } }
  });
  // empujar el estado actual al arrancar
  if(window.rcTimer.update){ try{ window.rcTimer.update(data.ui.timer||null); }catch(e){} }
}
// flechas del teclado para navegar el tablero + zoom
document.addEventListener('keydown', e=>{
  // buscar con Ctrl+K o /
  if((e.ctrlKey||e.metaKey) && (e.key==='k'||e.key==='K')){ openSearch(); e.preventDefault(); return; }
  if(e.key==='/' ){
    const ae=document.activeElement;
    if(!(ae && (ae.isContentEditable || ae.tagName==='TEXTAREA' || ae.tagName==='INPUT' || ae.tagName==='SELECT'))){ openSearch(); e.preventDefault(); return; }
  }
  // zoom con Ctrl + / − / 0
  if(e.ctrlKey||e.metaKey){
    if(e.key==='='||e.key==='+'){ zoomStep(1); e.preventDefault(); return; }
    if(e.key==='-'||e.key==='_'){ zoomStep(-1); e.preventDefault(); return; }
    if(e.key==='0'){ zoomReset(); e.preventDefault(); return; }
  }
  if(data.ui.view!=='board') return;
  const ae=document.activeElement;
  if(ae && (ae.isContentEditable || ae.tagName==='TEXTAREA' || ae.tagName==='INPUT')) return;
  const sc=document.querySelector('.board-scroll'); if(!sc) return;
  if(e.key==='ArrowRight'){ sc.scrollBy({left:340,behavior:'smooth'}); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ sc.scrollBy({left:-340,behavior:'smooth'}); e.preventDefault(); }
});

// re-empaquetar al cambiar tamaño de ventana (modo empaquetado)
let _rzT=null;
let _rzW = window.innerWidth;
function _escribiendo(){
  const a=document.activeElement;
  return !!(a && (a.isContentEditable || a.tagName==='TEXTAREA' ||
                  a.tagName==='INPUT' || a.tagName==='SELECT'));
}
window.addEventListener('resize', ()=>{
  // En el teléfono, abrir el teclado dispara 'resize' aunque solo cambie el alto.
  // Si volvemos a dibujar el tablero, el campo de la tarea se destruye y se
  // pierde lo escrito. Solo re-empaquetamos si cambió el ANCHO, y nunca
  // mientras se está escribiendo.
  if(window.innerWidth === _rzW) return;
  _rzW = window.innerWidth;
  clearTimeout(_rzT);
  _rzT=setTimeout(()=>{
    if(_escribiendo()) return;
    if(data.ui.view==='board' && (data.ui.layout||'packed')==='packed') render();
  }, 250);
});
// re-empaquetar cuando terminan de cargar las fuentes (alturas exactas)
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ if(_escribiendo()) return;
    if(data.ui.view==='board' && (data.ui.layout||'packed')==='packed') render(); });
}

// re-sync between tabs / windows
window.addEventListener('storage',e=>{ if(e.key===KEY){ load(); render(); } });
