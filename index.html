/* empaquetado por lanes: mide cada columna y apila proyectos cortos */
function packColumns(scroll, board, colEls, addColBtn){
  board.style.zoom=1;                              // medir en px de layout reales
  const measure=el('div',{class:'lane'});
  colEls.forEach(c=>measure.append(c));
  board.append(measure);

  const cs=getComputedStyle(scroll);
  const padT=parseFloat(cs.paddingTop)||0, padB=parseFloat(cs.paddingBottom)||0;
  const zoom=data.ui.zoom||1;
  // Tope seguro: nunca más que la ventana real (evita que un alto mal medido
  // meta todas las columnas en una sola lane).
  const avail = Math.min((scroll.clientHeight||700), window.innerHeight - 110);
  const laneMax=Math.max(260, (avail - padT - padB) / zoom);

  const info=colEls.map(c=>{
    let h=c.offsetHeight;
    if(h>laneMax){                                 // columna muy alta: su lista scrollea internamente
      const cardsEl=c.querySelector('.cards');
      if(cardsEl){
        const reduce=h-laneMax+10;
        cardsEl.style.maxHeight=Math.max(90, cardsEl.offsetHeight-reduce)+'px';
        cardsEl.style.overflowY='auto';
        h=c.offsetHeight;
      }
    }
    return {el:c,h};
  });
  measure.remove();

  board.innerHTML='';
  let lane=el('div',{class:'lane'}), used=0; board.append(lane);
  info.forEach(({el:c,h})=>{
    if(used>0 && used+h>laneMax){ lane=el('div',{class:'lane'}); board.append(lane); used=0; }
    lane.append(c); used+=h+16;
  });
  if(used>0 && used+64>laneMax){ lane=el('div',{class:'lane'}); board.append(lane); used=0; }
  lane.append(addColBtn);

  board.style.zoom=data.ui.zoom||1;
}

function attachBoardNav(scroll, root){
  const step = () => Math.min(340, scroll.clientWidth*0.85);

  // rueda vertical -> desplazamiento horizontal (salvo que una columna alta pueda scrollear)
  scroll.addEventListener('wheel', e=>{
    if(e.ctrlKey){ e.preventDefault(); zoomStep(e.deltaY<0?1:-1); return; }  // Ctrl+rueda = zoom
    if(e.deltaX!==0) return;              // trackpad horizontal ya funciona
    const cardsEl = e.target.closest && e.target.closest('.cards');
    if(cardsEl){
      const canDown = e.deltaY>0 && cardsEl.scrollTop + cardsEl.clientHeight < cardsEl.scrollHeight-1;
      const canUp   = e.deltaY<0 && cardsEl.scrollTop > 0;
      if(canDown||canUp) return;          // deja scrollear la columna verticalmente
    }
    if(scroll.scrollWidth > scroll.clientWidth){
      scroll.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  },{passive:false});

  // arrastrar el fondo para desplazar (pan con mouse)
  let panning=false, sx=0, sl=0, moved=0;
  scroll.addEventListener('pointerdown', e=>{
    // en pantallas táctiles dejamos que el teléfono haga su propio scroll:
    // si capturamos el dedo, el deslizar lateral deja de funcionar
    if(e.pointerType && e.pointerType!=='mouse') return;
    if(e.button!==0) return;
    if(e.target.closest('.card, .proj-meta, .col-grip, .col-head, .add-input-wrap, textarea, input, button, select, [contenteditable="true"]')) return;
    panning=true; moved=0; sx=e.clientX; sl=scroll.scrollLeft;
    scroll.classList.add('grabbing');
    try{ scroll.setPointerCapture(e.pointerId); }catch(_){}
  });
  scroll.addEventListener('pointermove', e=>{
    if(!panning) return;
    const dx=e.clientX-sx; moved=Math.max(moved,Math.abs(dx));
    scroll.scrollLeft = sl - dx;
  });
  const endPan=()=>{ panning=false; scroll.classList.remove('grabbing'); };
  scroll.addEventListener('pointerup', endPan);
  scroll.addEventListener('pointercancel', endPan);

  // flechas en pantalla
  const mk = (dir,cls,glyph)=> el('button',{class:'nav-arrow '+cls,title:'Desplazar',
    onclick:()=>scroll.scrollBy({left:dir*step(),behavior:'smooth'})}, glyph);
  const leftBtn = mk(-1,'left','‹');
  const rightBtn = mk(1,'right','›');
  root.append(leftBtn, rightBtn);

  const upd=()=>{
    const overflow = scroll.scrollWidth > scroll.clientWidth + 4;
    scroll.classList.toggle('grabbable', overflow);
    leftBtn.style.display  = overflow && scroll.scrollLeft > 4 ? 'grid':'none';
    rightBtn.style.display = overflow && (scroll.scrollLeft + scroll.clientWidth < scroll.scrollWidth-4) ? 'grid':'none';
  };
  scroll.addEventListener('scroll', upd);
  window.addEventListener('resize', upd);
  requestAnimationFrame(upd); setTimeout(upd,300);
}

function renderColumn(area,col){

  const idx = area.columns.indexOf(col);

  grip.addEventListener('dragend',()=>{ DRAG=null; });
  const head=el('div',{class:'col-head'},
    grip,
    el('span',{class:'cname',contenteditable:'true',text:col.name,
      onblur:e=>{ const v=e.target.textContent.trim(); if(v){col.name=v;save();} else e.target.textContent=col.name; },
      onkeydown:e=>{ if(e.key==='Enter'){e.preventDefault();e.target.blur();} }}),
    el('span',{class:'ccount mono',text:pend}),
    el('div',{class:'col-actions'},
      el('button',{class:'timer-btn'+(data.ui.timer&&data.ui.timer.colId===col.id?' on':''),title:'Temporizador',onclick:()=>openTimerStart(area,col)},'▶'),
      el('button',{class:'ficha-btn',title:'Ficha: anticipo, revisiones y equipo',onclick:()=>openFicha(area,col)},'✎'),
      el('button',{title:'Mover a la izquierda',disabled:idx===0,style:idx===0?'opacity:.25':'',onclick:()=>moveColumn(area,col,-1)},'‹'),
      el('button',{title:'Mover a la derecha',disabled:idx===area.columns.length-1,style:idx===area.columns.length-1?'opacity:.25':'',onclick:()=>moveColumn(area,col,1)},'›'),
      el('button',{class:'del',title:'Eliminar sección',onclick:()=>{
        if(col.tasks.length && !confirm('Eliminar "'+col.name+'" con sus '+col.tasks.length+' tareas?')) return;
        area.columns=area.columns.filter(x=>x!==col); render();
      }},'×')
    )
  );

  const cards=el('div',{class:'cards'});
  cards.dataset.colId=col.id;
  const list = data.ui.hideDone ? col.tasks.filter(t=>!t.done) : col.tasks.slice();
  list.forEach(t=>cards.append(renderCard(area,col,t)));

  // dnd de tarjetas en el contenedor
  cards.addEventListener('dragover',e=>{ if(DRAG&&DRAG.kind!=='card') return; e.preventDefault(); cards.classList.add('drag-over'); });
  cards.addEventListener('dragleave',()=>cards.classList.remove('drag-over'));
  cards.addEventListener('drop',e=>{ if(DRAG&&DRAG.kind!=='card') return; e.preventDefault(); cards.classList.remove('drag-over'); handleDrop(area,col,cards,e); });

  const addBtn=el('button',{class:'add-card',onclick:e=>openInlineAdd(col,cards,addBtn)},
    el('span',{class:'plus',text:'＋'}),' Añadir tarea');

  const wrap=el('div',{class:'column band-'+projBand(ensureMeta(col))}); wrap.dataset.colId=col.id;
  wrap.append(head, renderMetaStrip(area,col), cards, addBtn);
  return wrap;
}

function moveColumn(area,col,dir){
  const i=area.columns.indexOf(col), j=i+dir;
  if(j<0||j>=area.columns.length) return;
  area.columns.splice(i,1); area.columns.splice(j,0,col); render();
}

/* ============ FICHA: plazos y equipo ============ */
const ESPECIALIDADES=[['estructura','Estructura'],['clima','Clima'],['sanitario','Sanitario'],['electrico','Eléctrico']];
const EQUIPO_EMEP=['Eduardo Rojas','Mathias Christie Poffan','Osvaldo Fredes','Marco Riveros','Juan Ventura','Emilia Rojas'];
function roster(){
  if(!data.equipo) data.equipo=[];
  // siempre sugiere al equipo EMEP + los ya guardados + los usados en fichas, sin duplicar
  const used=new Set([...EQUIPO_EMEP, ...data.equipo]);
  data.areas.forEach(a=>a.columns.forEach(c=>{ const t=c.meta&&c.meta.team||{}; Object.values(t).forEach(n=>{ if(n&&!used.has(n)) used.add(n); }); }));
  return [...used];
}

function daysBetween(a,b){ // fechas ISO; b default hoy
  if(!a) return null;
  const d1=new Date(a+'T00:00:00'), d2=b?new Date(b+'T00:00:00'):new Date();
  d2.setHours(0,0,0,0);
  return Math.round((d2-d1)/86400000);
}
function ensureMeta(col){
  if(!col.meta) col.meta={anticipo:null,revA:null,revB:null,rev0:null,team:{}};
  if(!col.meta.team) col.meta.team={};
  if(!col.meta.fin) col.meta.fin={presupuesto:0,cobrado:0,pagosList:[]};
  const fin=col.meta.fin;
  if(!fin.pagosList){
    fin.pagosList=[];
    // migrar totales antiguos por especialidad a pagos individuales
    if(fin.pagos){
      Object.keys(fin.pagos).forEach(k=>{ if(fin.pagos[k]>0) fin.pagosList.push({id:uid(),fecha:null,especialidad:k,monto:fin.pagos[k]}); });
    }
  }
  if(!fin.gastosList) fin.gastosList=[];
  if(col.meta.timeSpent==null) col.meta.timeSpent=0;
  return col.meta;
}
function clp(n){ n=Math.round(n||0); return '$'+n.toLocaleString('es-CL'); }
function clpShort(n){
  n=Math.round(n||0); const a=Math.abs(n);
  if(a>=1000000) return '$'+(n/1000000).toLocaleString('es-CL',{maximumFractionDigits:1})+'M';
  if(a>=1000) return '$'+Math.round(n/1000)+'k';
  return '$'+n;
}
function finCalc(m){
  const p=m.fin||{};
  const lista=p.pagosList||[];
  const abonado=lista.reduce((s,x)=>s+(x.monto||0),0);
  const presu=p.presupuesto||0;
  // "cobrado" = suma de abonos si hay lista; si no, respeta el valor manual antiguo
  const cobrado = lista.length ? abonado : (p.cobrado||0);
  const porCobrar=presu-cobrado;
  const pct = presu>0 ? cobrado/presu : 0;
  const gastos=p.gastosList||[];
  const gastado=gastos.reduce((s,x)=>s+(x.monto||0),0);
  return { presu, cobrado, porCobrar, abonado, pct, pagos:lista, gastado, gastos };
}
const CATGASTO=[['esp','Especialista'],['soft','Software'],['ofi','Oficina'],['otro','Otro']];
function shortName(full){
  const p=(full||'').trim().split(/\s+/);
  return p.length>1 ? p[0]+' '+p[1][0]+'.' : p[0]||'';
}

function projBand(m){
  if(!m || !m.anticipo) return 'none';
  if(m.rev0) return 'closed';
  const d=daysBetween(m.anticipo);
  if(d>=60) return 'alert';
  if(d>=45) return 'late';
  if(d>=30) return 'warn';
  return 'ok';
}
function renderMetaStrip(area,col){
  const m=ensureMeta(col);
  const strip=el('div',{class:'proj-meta',title:'Clic para editar ficha: anticipo, revisiones y equipo',
    onclick:()=>openFicha(area,col)});
  const top=el('div',{class:'pm-top'});
  if(m.anticipo){
    if(m.rev0){
      const total=daysBetween(m.anticipo,m.rev0);
      top.append(el('span',{class:'pm-days closed',text:total+'d'}),
                 el('span',{class:'pm-label',text:'cerrado · Rev 0 entregada'}));
    } else {
      const d=daysBetween(m.anticipo);
      const cls = d>=60?'alert' : d>=45?'late' : d>=30?'warn' : 'ok';
      top.append(el('span',{class:'pm-days '+cls,text:d+'d'}),
                 el('span',{class:'pm-label',text:'desde anticipo'}));
    }
  } else {
    top.append(el('span',{class:'pm-empty',text:'⊕ sin anticipo · clic para fijar'}));
  }
  strip.append(top);

  const isTimed = data.ui.timer && data.ui.timer.colId===col.id;
  if((m.timeSpent||0) > 0 || isTimed){
    const liveExtra = isTimed ? timerElapsed(data.ui.timer) : 0;
    const tchip=el('div',{class:'pm-time'+(isTimed?' live':'')},
      el('span',{class:'pmt-ic',text:'⏱'}),
      el('span',{text: fmtHrs((m.timeSpent||0)+liveExtra) + (isTimed?' · corriendo':'') }));
    strip.append(tchip);
  }

  if(m.anticipo){
    const revs=el('div',{class:'pm-revs'});
    [['revA','Rev A'],['revB','Rev B'],['rev0','Rev 0']].forEach(([k,label])=>{
      const done=!!m[k];
      const chip=el('span',{class:'rev-chip'+(done?' done':'')+(k==='rev0'?' final':'')});
      chip.textContent = done ? label+' · día '+daysBetween(m.anticipo,m[k]) : label+' —';
      revs.append(chip);
    });
    strip.append(revs);
  }

  const assigned=ESPECIALIDADES.filter(([k])=>m.team[k]);
  if(assigned.length){
    const tm=el('div',{class:'pm-team'});
    assigned.forEach(([k,label])=>tm.append(el('span',{class:'team-chip',text:label.slice(0,3).toUpperCase()+' '+shortName(m.team[k])})));
    strip.append(tm);
  }

  const f=finCalc(m);
  if(f.presu>0){
    const money=el('div',{class:'pm-money'});
    const pctCls = f.pct>=0.99?'good' : f.pct>=0.5?'mid' : 'low';
    money.append(
      el('div',{class:'pm-money-row'},
        el('span',{class:'pmm-label',text:'cobrado'}),
        el('span',{class:'pmm-val '+pctCls,text:clpShort(f.cobrado)+'  ·  '+Math.round(f.pct*100)+'%'})),
      el('div',{class:'pm-money-sub'},
        'presup '+clpShort(f.presu)+' · por cobrar '+clpShort(f.porCobrar)),
      el('div',{class:'pm-bar '+pctCls}, el('i',{style:'width:'+Math.min(100,Math.round(f.pct*100))+'%'}))
    );
    strip.append(money);
  }
  return strip;
}

function openFicha(area,col){
  const m=ensureMeta(col);
  const ov=el('div',{class:'modal-ov',onclick:e=>{ if(e.target===ov) closeAll(); }});
  const grid=el('div',{class:'f-grid'});

  const dateField=(key,label)=>{
    const inp=el('input',{type:'date',value:m[key]||''});
    const apply=(val)=>{
      m[key]=val||null;
      if(key==='anticipo') syncAnticipoAbono();
      refresh();
    };
    inp.addEventListener('change',()=>apply(inp.value));
    const hoy=el('button',{class:'hoy-btn',onclick:()=>{ inp.value=todayStr(); apply(todayStr()); }},'hoy');
    return el('div',{class:'f-field'},el('label',{text:label}),el('div',{class:'f-row'},inp,hoy));
  };

  // El anticipo es el primer pago: se registra solo como "Abono 1".
  function syncAnticipoAbono(){
    if(!m.fin) m.fin={presupuesto:0,cobrado:0,pagosList:[],gastosList:[]};
    if(!m.fin.pagosList) m.fin.pagosList=[];
    const lista=m.fin.pagosList;
    let ab=lista.find(p=>p.esAnticipo);
    if(m.anticipo){
      if(ab){ ab.fecha=m.anticipo; }
      else { lista.unshift({id:uid(),fecha:m.anticipo,concepto:'anticipo',monto:0,esAnticipo:true}); }
    } else if(ab && !ab.monto){
      // si borran el anticipo y ese abono aún no tiene monto, se quita
      m.fin.pagosList=lista.filter(p=>p!==ab);
    }
    if(typeof renderPagos==='function') renderPagos();
    if(typeof refreshFin==='function') refreshFin();
  }

  const resumen=el('div',{class:'f-resumen'});
  function refresh(){
    save();
    if(!m.anticipo){ resumen.textContent='Fija la fecha del anticipo para que empiecen a correr los días.'; return; }
    const lines=['Anticipo: '+m.anticipo];
    const segs=[['revA','Rev A',m.anticipo],['revB','Rev B',m.revA||m.anticipo],['rev0','Rev 0',m.revB||m.revA||m.anticipo]];
    segs.forEach(([k,label,desde])=>{
      if(m[k]) lines.push(label+': día '+daysBetween(m.anticipo,m[k])+' · tramo '+daysBetween(desde,m[k])+'d');
    });
    if(m.rev0) lines.push('TOTAL: '+daysBetween(m.anticipo,m.rev0)+' días anticipo → Rev 0');
    else lines.push('Hoy: día '+daysBetween(m.anticipo)+' (corriendo)');
    resumen.textContent=lines.join('\n');
    resumen.style.whiteSpace='pre-line';
  }

  grid.append(
    dateField('anticipo','Anticipo (pago inicial)'),
    dateField('revA','Entrega Rev A'),
    dateField('revB','Entrega Rev B'),
    dateField('rev0','Entrega Rev 0 (cobro final)'),

/* ---- Importar movimientos del banco (JSON) ----
   Suma al historial SIN borrar nada. Descarta traspasos y
   evita duplicados usando el campo "ref" (id del correo).      */
function openImportarGastos(){
  ensurePersonal();
  const P=data.personal;
  const ov=el('div',{class:'modal-ov',onmousedown:e=>{ if(e.target===ov) ov.remove(); }});
  const ta=el('textarea',{spellcheck:'false',style:'width:100%;min-height:220px;font-family:IBM Plex Mono,monospace;font-size:11.5px'});
  ta.placeholder='Pega aquí el JSON de movimientos…';
  const info=el('div',{class:'pers-empty',style:'padding:8px 2px'});
  info.textContent='Suma los movimientos a tu historial. Los traspasos se descartan solos y no se repiten los que ya importaste.';
  const cargar=()=>{
    let arr=null;
    try{
      const d=JSON.parse(ta.value);
      arr = Array.isArray(d) ? d : (d && Array.isArray(d.movimientos) ? d.movimientos : null);
      if(!arr) throw 0;
    }catch(_){ info.textContent='⚠ El JSON no se entiende. Debe ser una lista de movimientos.'; return; }
    const yaTengo=new Set([
      ...P.movs.filter(m=>m.ref).map(m=>m.ref),
      ...(P.pend||[]).map(m=>m.ref),
      ...(P.ignorados||[])
    ]);
    let nuevos=0, saltados=0, traspasos=0;
    arr.forEach(m=>{
      if(!m || !m.monto) return;
      if(m.tipo==='traspaso'){ traspasos++; return; }              // plata que solo cambia de bolsillo
      if(m.ref && yaTengo.has(m.ref)){ saltados++; return; }        // ya estaba importado
      P.pend.push({
        id:uid(),
        fecha:m.fecha||todayStr(),
        tipo:(m.tipo==='ingreso'?'ingreso':'gasto'),
        desc:(m.desc||'').trim(),
        origen:m.origen||'',
        monto:parseInt(String(m.monto).replace(/[^\d]/g,''),10)||0,
        ref:m.ref||null
      });
      if(m.ref) yaTengo.add(m.ref);
      nuevos++;
    });
    save(); ov.remove(); render();
    alert('Llegaron '+nuevos+' movimientos a la bandeja "Por clasificar".\n\n'+
          'Traspasos descartados: '+traspasos+' (tu misma plata cambiando de cuenta)\n'+
          'Ya estaban: '+saltados+'\n\n'+
          'Ahora dile a cada uno si es Personal o EMEP. Voy aprendiendo de lo que elijas.');
  };
  ov.append(el('div',{class:'modal',style:'max-width:680px'},
    el('h4',{text:'Importar movimientos del banco'}),
    info, ta,
    el('div',{class:'m-row'},
      el('button',{onclick:()=>ov.remove()},'Cancelar'),
      el('button',{class:'primary',onclick:cargar},'Importar'))
  ));
  document.body.append(ov);
  setTimeout(()=>ta.focus(),50);
}

function ensurePersonal(){
  if(!data.personal) data.personal={movs:[],cats:null};
  if(!data.personal.movs) data.personal.movs=[];
  if(!data.personal.cats || !data.personal.cats.length) data.personal.cats=PERS_CATS_DEF.map(c=>({...c}));
  if(!data.personal.pend) data.personal.pend=[];          // movimientos por clasificar
  if(!data.personal.reglas) data.personal.reglas={};      // lo aprendido: quién suele ser qué
  if(!data.personal.ignorados) data.personal.ignorados=[];// refs descartados a mano
}

/* ---- Memoria: qué elegiste la última vez para este nombre ---- */
function reglaKey(desc){ return normTxt(desc||'').replace(/\s+/g,' ').trim(); }
function reglaDe(desc){ return data.personal.reglas[reglaKey(desc)]||null; }
function aprenderRegla(desc,r){ data.personal.reglas[reglaKey(desc)]=r; }

/* ---- Lista plana de proyectos, para mandar un gasto a su ficha ---- */
function todosLosProyectos(){
  const out=[];
  (data.areas||[]).forEach(a=>(a.columns||[]).forEach(c=>{ if(!c.archived) out.push({area:a,col:c}); }));

}

  const addMov=()=>{

  };

  // ---- bandeja: movimientos del banco por clasificar ----
  const triage=el('div',{class:'pers-triage'});
  view.append(triage);
  const TRI_ABIERTOS=new Set();   // nombres que el usuario decidió separar uno por uno
  function renderTriage(){
    triage.innerHTML='';
    const pend=P.pend||[];

    triage.append(el('div',{class:'f-sep2',
      text:'Por clasificar · '+pend.length+' movimiento'+(pend.length===1?'':'s')+' · '+clp(tot)}));
    const proys=todosLosProyectos();

    // Agrupar por nombre: "Uber Trip · 87 movimientos" se clasifica de una vez
    const grupos=new Map();
    pend.forEach(m=>{
      const k=(m.tipo==='ingreso'?'in:':'ga:')+reglaKey(m.desc);   // no mezclar ingresos con gastos
      if(!grupos.has(k)) grupos.set(k,{key:k,desc:m.desc,items:[]});
      grupos.get(k).items.push(m);
    });
    const lista=[...grupos.values()].sort((a,b)=>
      b.items.reduce((s,m)=>s+m.monto,0)-a.items.reduce((s,m)=>s+m.monto,0));

    // Una fila: sirve para un grupo entero o para un movimiento suelto
    function fila(desc,items,esGrupo,grupoKey){
      const row=el('div',{class:'triage-row'});
      const sug=reglaDe(desc);
      const suma=items.reduce((s,m)=>s+(m.monto||0),0);
      const info=el('div',{class:'triage-info'});
      if(esGrupo){
        info.append(el('span',{class:'triage-desc',text:desc||'(sin detalle)'}),
          el('span',{class:'triage-n mono',text:items.length+'×'}),
          el('span',{class:'triage-monto mono',text:clp(suma)}));
      } else {
        const m=items[0];
        info.append(el('span',{class:'triage-fecha mono',text:(m.fecha||'').slice(5)}),
          el('span',{class:'triage-desc',text:m.desc||'(sin detalle)'}),
          el('span',{class:'triage-monto mono',text:(m.tipo==='ingreso'?'+':'')+clp(m.monto)}));
      }
      row.append(info);

      const esIngreso = items[0] && items[0].tipo==='ingreso';
      const selAmb=el('select',{class:'pa-in'});
      if(esIngreso){
        // un ingreso puede ir a un proyecto, a lo personal, o quedar "sin identificar"
        selAmb.append(el('option',{value:'emep',text:'Proyecto'}),
                      el('option',{value:'sinproy',text:'Sin identificar aún'}),
                      el('option',{value:'personal',text:'Personal'}));
        selAmb.value = (sug && sug.ambito) ? sug.ambito : 'sinproy';
      } else {
        selAmb.append(el('option',{value:'personal',text:'Personal'}),el('option',{value:'emep',text:'EMEP · proyecto'}));
        if(sug && sug.ambito==='emep') selAmb.value='emep';
      }
      const selCat=el('select',{class:'pa-in'});
      P.cats.forEach(c=>selCat.append(el('option',{value:c.k,text:c.label})));
      if(sug && sug.cat) selCat.value=sug.cat;
      const selProy=el('select',{class:'pa-in'});
      selProy.append(el('option',{value:'',text:'— elige proyecto —'}));
      proys.forEach(p=>selProy.append(el('option',{value:p.col.id,text:p.col.name})));
      if(sug && sug.proyecto) selProy.value=sug.proyecto;
      const sync=()=>{ const v=selAmb.value;
        selCat.style.display = (v==='personal')?'':'none';
        selProy.style.display= (v==='emep')?'':'none'; };
      selAmb.addEventListener('change',sync); sync();

      const guardar=()=>{
        if(selAmb.value==='sinproy'){
          // queda en el registro y suma en Finanzas, pero sin proyecto todavía
          if(!data.ingresosGenerales) data.ingresosGenerales=[];
          items.forEach(m=>data.ingresosGenerales.push({
            id:uid(), fecha:m.fecha, who:m.desc, desc:m.desc,
            concepto:'sin identificar aún', monto:m.monto, ref:m.ref }));
          aprenderRegla(desc,{ambito:'sinproy'});
        } else if(selAmb.value==='emep'){
          const col=(proys.find(p=>p.col.id===selProy.value)||{}).col;
          if(!col){ selProy.focus(); return; }
          if(!col.meta) col.meta={};
          if(!col.meta.fin) col.meta.fin={presupuesto:0,cobrado:0,pagosList:[],gastosList:[]};
          if(!col.meta.fin.gastosList) col.meta.fin.gastosList=[];
          if(esIngreso){
            if(!col.meta.fin.pagosList) col.meta.fin.pagosList=[];
            items.forEach(m=>col.meta.fin.pagosList.push({id:uid(),fecha:m.fecha,concepto:'abono',monto:m.monto,ref:m.ref}));
          } else {
            items.forEach(m=>col.meta.fin.gastosList.push({id:uid(),fecha:m.fecha,who:m.desc,cat:'esp',monto:m.monto,ref:m.ref}));
          }
          aprenderRegla(desc,{ambito:'emep',proyecto:col.id});
        } else {
          items.forEach(m=>P.movs.push({id:uid(),fecha:m.fecha,tipo:m.tipo,cat:selCat.value,
            desc:m.desc+(m.origen?(' · '+m.origen):''),monto:m.monto,ref:m.ref}));
          aprenderRegla(desc,{ambito:'personal',cat:selCat.value});
        }
        const fuera=new Set(items);
        P.pend=P.pend.filter(x=>!fuera.has(x));
        save(); renderTriage(); redraw();
      };
      const ignorar=()=>{
        items.forEach(m=>{ if(m.ref) P.ignorados.push(m.ref); });
        const fuera=new Set(items);
        P.pend=P.pend.filter(x=>!fuera.has(x));
        save(); renderTriage();
      };

      const acts=el('div',{class:'triage-acts'},selAmb,selCat,selProy,
        el('button',{class:'pa-btn',onclick:guardar}, esGrupo?('✓ Guardar los '+items.length):'✓ Guardar'),
        el('button',{class:'pa-ign',title:'No es un gasto · descartar',onclick:ignorar},'✕'));
      if(esGrupo){
        acts.append(el('button',{class:'pa-ign',title:'Clasificar uno por uno',
          onclick:()=>{ TRI_ABIERTOS.add(grupoKey); renderTriage(); }},'▸ separar'));
      }
      row.append(acts);
      if(sug) row.append(el('div',{class:'triage-sug',text:'↺ la última vez lo pusiste así'}));
      return row;
    }

    let mostrados=0;
    for(const g of lista){
      if(mostrados>=25) break;
      if(g.items.length>1 && !TRI_ABIERTOS.has(g.key)){
        triage.append(fila(g.desc,g.items,true,g.key));
      } else {
        if(g.items.length>1){
          triage.append(el('div',{class:'triage-sub',text:'▾ '+g.desc+' · uno por uno'}));
        }
        g.items.slice(0,30).forEach(m=>triage.append(fila(m.desc,[m],false,g.key)));
      }
      mostrados++;
    }
    if(lista.length>mostrados){
      triage.append(el('div',{class:'pers-empty',
        text:'…y '+(lista.length-mostrados)+' nombres más. Ve clasificando y aparecen los siguientes.'}));
    }
  }


  // ---- cuerpo (mes + resumen + lista) que se redibuja ----
  const body=el('div',{class:'pers-body'});
  view.append(body);
  renderTriage();

  function redraw(){
    body.innerHTML='';
    // selector de mes
    const sel=el('div',{class:'pers-selbar'},
      el('button',{class:'nav-btn',onclick:()=>{ PERS_M--; if(PERS_M<1){PERS_M=12;PERS_Y--;} redraw(); }},'‹'),
      el('div',{class:'pers-month',text:MESES_F[PERS_M-1]+' '+PERS_Y}),
      el('button',{class:'nav-btn',onclick:()=>{ PERS_M++; if(PERS_M>12){PERS_M=1;PERS_Y++;} redraw(); }},'›'));
    body.append(sel);

    const movs=P.movs.filter(x=>{ const d=ym(x.fecha); return d&&d.y===PERS_Y&&d.m===PERS_M; });
    const gastos=movs.filter(x=>x.tipo!=='ingreso');
    const ingresos=movs.filter(x=>x.tipo==='ingreso');
    const totG=gastos.reduce((s,x)=>s+x.monto,0);
    const totI=ingresos.reduce((s,x)=>s+x.monto,0);

    // resumen
    body.append(el('div',{class:'pers-sum'},
      el('div',{class:'fin-mc out'},el('div',{class:'k',text:'Gastado en el mes'}),el('div',{class:'v',text:clp(totG)})),
      el('div',{class:'fin-mc inc'},el('div',{class:'k',text:'Ingresos en el mes'}),el('div',{class:'v',text:clp(totI)})),
      el('div',{class:'fin-mc'},el('div',{class:'k',text:'Neto'}),el('div',{class:'v '+(totI-totG>=0?'pos':'neg'),text:clp(totI-totG)}))));

    // ---- utilidad del estudio en el mismo mes, para ver el cuadro completo ----
    (function(){
      const {ingresos,gastos:gproy}=finGather();
      const enMes=x=>{ const d=ym(x.fecha); return d && d.y===PERS_Y && d.m===PERS_M; };
      const eIn=ingresos.filter(enMes).reduce((s,x)=>s+x.monto,0);
      const eOut=gproy.filter(enMes).reduce((s,x)=>s+x.monto,0);
      if(!eIn && !eOut) return;
      const util=eIn-eOut, bolsillo=util-totG+totI;
      body.append(el('div',{class:'fin-det-h'},el('span',{class:'dm',text:'Tu estudio este mes'})));
      body.append(el('div',{class:'pers-sum'},
        el('div',{class:'fin-mc inc'},el('div',{class:'k',text:'Recibido (proyectos)'}),el('div',{class:'v',text:clp(eIn)})),
        el('div',{class:'fin-mc out'},el('div',{class:'k',text:'Pagado al equipo'}),el('div',{class:'v',text:clp(eOut)})),
        el('div',{class:'fin-mc'},el('div',{class:'k',text:'Utilidad del estudio'}),
          el('div',{class:'v '+(util>=0?'pos':'neg'),text:clp(util)}))));
      body.append(el('div',{class:'pers-empty',style:'padding:2px 2px 18px',
        text:'Utilidad del estudio menos tus gastos personales: '+clp(bolsillo)+
             (bolsillo>=0?' te quedó en el bolsillo.':' saliste en rojo este mes.')}));
    })();

    // desglose por categoría (gastos)
    body.append(el('div',{class:'fin-det-h'},el('span',{class:'dm',text:'En qué se fue la plata'})));
    if(!gastos.length){
      body.append(el('div',{class:'pers-empty',text:'Aún no registras gastos este mes. Usa la fila de arriba para empezar.'}));
    } else {
      const byCat={};
      gastos.forEach(x=>{ byCat[x.cat]=(byCat[x.cat]||0)+x.monto; });
      const rows=Object.keys(byCat).map(k=>({k,monto:byCat[k]})).sort((a,b)=>b.monto-a.monto);
      const max=rows[0].monto||1;
      const cats=el('div',{class:'pers-cats'});
      rows.forEach(r=>{
        const c=persCat(r.k); const pct=Math.round(r.monto/totG*100);
        cats.append(el('div',{class:'pcat'},
          el('div',{class:'pcat-top'},
            el('span',{class:'pcat-dot',style:'background:'+c.color}),
            el('span',{class:'pcat-name',text:c.label}),
            el('span',{class:'pcat-amt',text:clp(r.monto)+' · '+pct+'%'})),
          el('div',{class:'pcat-bar'},el('i',{style:'width:'+(r.monto/max*100)+'%;background:'+c.color}))));
      });
      body.append(cats);
    }

    // lista de movimientos del mes
    body.append(el('div',{class:'fin-det-h',style:'margin-top:24px'},el('span',{class:'dm',text:'Movimientos'})));
    const list=el('div',{class:'pers-list'});
    if(!movs.length){ list.append(el('div',{class:'pers-empty',text:'Sin movimientos este mes.'})); }
    movs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).forEach(x=>{
      const c=persCat(x.cat);
      const row=el('div',{class:'pers-item'+(x.tipo==='ingreso'?' ing':'')},
        el('span',{class:'pi-date',text:(x.fecha?x.fecha.slice(8,10)+' '+M3_F[(+x.fecha.slice(5,7))-1]:'—')}),
        el('span',{class:'pi-cat',style:'color:'+c.color+';border-color:'+c.color,text:c.label}),
        el('span',{class:'pi-desc',text:x.desc||(x.tipo==='ingreso'?'ingreso':'—')}),
        el('span',{class:'pi-amt',text:(x.tipo==='ingreso'?'+':'−')+clp(x.monto).slice(1)}),
        el('button',{class:'pi-del',title:'Eliminar',onclick:()=>{ P.movs=P.movs.filter(y=>y!==x); save(); redraw(); }},'×'));
      list.append(row);
    });
    body.append(list);
  }
  redraw();
  root.append(view);
  if(PERS_FOCUS){ PERS_FOCUS=false; }
  setTimeout(()=>qMonto.focus(),40);
}

/* ============ TIEMPO (horas trabajadas) ============ */
let TIME_Y=null, TIME_M=null;
function renderTiempo(root){
  if(!data.timeLog) data.timeLog=[];
  const now=new Date();
  if(TIME_Y==null) TIME_Y=now.getFullYear();
  if(TIME_M==null) TIME_M=now.getMonth()+1;
  const view=el('div',{class:'today-view time-view'});

  // selector de mes
  view.append(el('div',{class:'pers-selbar'},
    el('button',{class:'nav-btn',onclick:()=>{ TIME_M--; if(TIME_M<1){TIME_M=12;TIME_Y--;} render(); }},'‹'),
    el('div',{class:'pers-month',text:MESES_F[TIME_M-1]+' '+TIME_Y}),
    el('button',{class:'nav-btn',onclick:()=>{ TIME_M++; if(TIME_M>12){TIME_M=1;TIME_Y++;} render(); }},'›')));

  const sesiones=data.timeLog.filter(x=>{ const d=ym(x.fecha); return d&&d.y===TIME_Y&&d.m===TIME_M; });
  const totalSec=sesiones.reduce((s,x)=>s+(x.sec||0),0);

  // resumen
  const dias=new Set(sesiones.map(x=>x.fecha)).size;
  view.append(el('div',{class:'pers-sum'},
    el('div',{class:'fin-mc'},el('div',{class:'k',text:'Total del mes'}),el('div',{class:'v',text:fmtHrs(totalSec,1)})),
    el('div',{class:'fin-mc'},el('div',{class:'k',text:'Días trabajados'}),el('div',{class:'v',text:dias})),
    el('div',{class:'fin-mc'},el('div',{class:'k',text:'Promedio por día'}),el('div',{class:'v',text:fmtHrs(dias?totalSec/dias:0,1)}))));

  // por proyecto
  view.append(el('div',{class:'fin-det-h'},el('span',{class:'dm',text:'Horas por proyecto'})));
  if(!sesiones.length){
    view.append(el('div',{class:'pers-empty',text:'Aún no hay tiempo registrado este mes. Usa el ▶ de un proyecto para cronometrar; al terminar, la sesión queda aquí.'}));
  } else {
    const byProj={};
    sesiones.forEach(x=>{ byProj[x.colId]=(byProj[x.colId]||0)+(x.sec||0); });
    const rows=Object.keys(byProj).map(cid=>{ const r=findColById(cid); return {cid,sec:byProj[cid],name:r?r.col.name:'(proyecto eliminado)',area:r?r.area.name:''}; })
      .sort((a,b)=>b.sec-a.sec);
    const max=rows[0].sec||1;
    const wrap=el('div',{class:'time-bars'});
    rows.forEach(r=>{
      wrap.append(el('div',{class:'tbar'},
        el('div',{class:'tbar-top'},
          el('span',{class:'tbar-name',text:r.name}),
          el('span',{class:'tbar-h',text:fmtHrs(r.sec,1)})),
        el('div',{class:'tbar-track'},el('i',{style:'width:'+(r.sec/max*100)+'%'}))));
    });
    view.append(wrap);
  }

  // por día
  view.append(el('div',{class:'fin-det-h',style:'margin-top:24px'},el('span',{class:'dm',text:'Horas por día'})));
  const daysInMonth=new Date(TIME_Y,TIME_M,0).getDate();
  const byDay=new Array(daysInMonth+1).fill(0);
  sesiones.forEach(x=>{ const d=parseInt((x.fecha||'').slice(8,10),10); if(d>=1&&d<=daysInMonth) byDay[d]+=(x.sec||0); });
  const maxDay=Math.max(1,...byDay);
  const chart=el('div',{class:'time-days'});
  for(let d=1;d<=daysInMonth;d++){
    const sec=byDay[d];
    const col=el('div',{class:'tday',title:d+' · '+fmtHrs(sec,1)},
      el('div',{class:'tday-bar-wrap'}, el('i',{class:'tday-bar',style:'height:'+(sec/maxDay*100)+'%'})),
      el('span',{class:'tday-n',text:d}));
    if(sec>0) col.classList.add('has');
    chart.append(col);
  }
  view.append(chart);

  // histórico por proyecto (todo el tiempo, incluye lo anterior sin fecha)
  const hist=[];
  data.areas.forEach(a=>a.columns.forEach(c=>{ const s=(c.meta&&c.meta.timeSpent)||0; if(s>0) hist.push({colId:c.id,name:c.name,area:a.name,sec:s}); }));
  if(hist.length){
    hist.sort((a,b)=>b.sec-a.sec);
    view.append(el('div',{class:'fin-det-h',style:'margin-top:24px'},el('span',{class:'dm',text:'Total histórico por proyecto'}),el('span',{class:'dm-hint',text:'clic para corregir'})));
    const ht=el('div',{class:'time-hist'});
    hist.forEach(r=>{ ht.append(el('div',{class:'thist-row edit-hrs',title:'Clic para corregir las horas',onclick:()=>editarHorasProyecto(r.colId,r.name,r.sec)},
      el('span',{class:'thr-name',text:r.name}),
      el('span',{class:'thr-area',text:r.area}),
      el('span',{class:'thr-h',text:fmtHrs(r.sec,1)}))); });
    view.append(ht);
    view.append(el('div',{class:'fin-note',text:'El histórico incluye todo lo cronometrado. El desglose por mes/día de arriba se construye con las sesiones registradas desde ahora.'}));
  }

  root.append(view);
}

function mktEstadoLabel(k){ const e=MKT_ESTADOS.find(x=>x[0]===k); return e?e[1]:'—'; }
function mktPlat(){ return [['ig','Instagram'],['li','LinkedIn']]; }

function renderMarketing(root){

function mktSortByDate(arr){ return arr.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')); }
function mktPill(estado){
  const map={ok:['publicado','var(--bg-good,#1e3a34)','var(--today)'],prog:['programado','#3a3320','var(--p2)'],pend:['pendiente','#3a2420','var(--p1)'],no:['—','transparent','var(--faint)']};
  const m=map[estado]||map.no;
  return el('span',{class:'mkt-pill',style:'background:'+m[1]+';color:'+m[2],text:m[0]});
}

/* ---- Vista LISTA (registro filtrable) ---- */
function mktLista(body){
  const M=data.mkt;
  const fil=el('div',{class:'mkt-filtros'});
  [['all','Todas'],['ig','Instagram'],['li','LinkedIn']].forEach(([k,label])=>{

      el('span',{},el('span',{class:'mkt-marca',text:p.marca||'—'})));
    cols.forEach(c=>row.append(el('span',{style:'text-align:center'}, mktPill(p[c]||'no'))));
    row.append(el('button',{class:'mkt-del',title:'Eliminar',onclick:()=>{ if(confirm('¿Eliminar esta publicación?')){ M.posts=M.posts.filter(x=>x!==p); save(); render(); } }},'×'));
    tbl.append(row);
  });
  body.append(tbl);
}
function mktGrid(nplat){ let g='90px 1fr 110px'; for(let i=0;i<nplat;i++) g+=' 110px'; g+=' 34px'; return g; }

/* ---- Vista KANBAN (por estado de producción) ---- */
function mktKanban(body){
  const M=data.mkt;
  // estado global de la pieza: si ambas plataformas ok → publicado; si alguna prog → listo; si todo pend → por hacer; else idea
  const colFor=(p)=>{
    const s=[p.ig,p.li].filter(x=>x&&x!=='no');
    if(s.length && s.every(x=>x==='ok')) return 'publicado';
    if(s.some(x=>x==='prog'||x==='ok')) return 'listo';
    if(p.titulo) return 'porhacer';
    return 'idea';
  };
  const lanes=[['idea','Idea'],['porhacer','Por hacer'],['listo','Listo p/publicar'],['publicado','Publicado']];
  const board=el('div',{class:'mkt-kanban'});
  lanes.forEach(([k,label])=>{
    const lane=el('div',{class:'mkt-lane'});
    const items=M.posts.filter(p=>colFor(p)===k);
    lane.append(el('div',{class:'mkt-lane-h'},label,el('span',{class:'mkt-lane-n',text:items.length||''})));
    mktSortByDate(items).forEach(p=>{
      const card=el('div',{class:'mkt-card',onclick:()=>openMktPost(p)});
      card.append(el('div',{class:'mkt-card-t',text:p.titulo||'(sin título)'}));
      const meta=el('div',{class:'mkt-card-m'});
      if(p.marca) meta.append(el('span',{class:'mkt-marca',text:p.marca}));
      if(p.fecha) meta.append(el('span',{class:'mkt-card-f',text:mktFmtFecha(p.fecha)}));
      card.append(meta);
      const plats=el('div',{class:'mkt-card-p'});
      if(p.ig&&p.ig!=='no') plats.append(el('span',{class:'mkt-tag ig',text:'IG '+(p.ig==='ok'?'✓':p.ig==='prog'?'◷':'·')}));
      if(p.li&&p.li!=='no') plats.append(el('span',{class:'mkt-tag li',text:'LI '+(p.li==='ok'?'✓':p.li==='prog'?'◷':'·')}));
      card.append(plats);
      lane.append(card);
    });
    board.append(lane);
  });
  body.append(board);
}

/* ---- Vista CALENDARIO ---- */
function mktCalendario(body){
  const M=data.mkt;
  body.append(el('div',{class:'pers-selbar'},
    el('button',{class:'nav-btn',onclick:()=>{ MKT_M--; if(MKT_M<1){MKT_M=12;MKT_Y--;} render(); }},'‹'),
    el('div',{class:'pers-month',text:MESES_F[MKT_M-1]+' '+MKT_Y}),
    el('button',{class:'nav-btn',onclick:()=>{ MKT_M++; if(MKT_M>12){MKT_M=1;MKT_Y++;} render(); }},'›')));

  const daysInMonth=new Date(MKT_Y,MKT_M,0).getDate();
  let firstDow=new Date(MKT_Y,MKT_M-1,1).getDay(); firstDow=(firstDow===0)?6:firstDow-1; // lunes=0
  const grid=el('div',{class:'mkt-cal'});
  ['L','M','M','J','V','S','D'].forEach(d=>grid.append(el('div',{class:'mkt-cal-dow',text:d})));
  for(let i=0;i<firstDow;i++) grid.append(el('div',{}));
  for(let d=1;d<=daysInMonth;d++){
    const fecha=MKT_Y+'-'+String(MKT_M).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayPosts=M.posts.filter(p=>p.fecha===fecha);
    const cell=el('div',{class:'mkt-cal-cell',onclick:()=>openMktPost(null,fecha)});
    cell.append(el('span',{class:'mkt-cal-n',text:d}));
    const dots=el('div',{class:'mkt-cal-posts'});
    dayPosts.slice(0,3).forEach(p=>{
      dots.append(el('div',{class:'mkt-cal-post',onclick:(e)=>{ e.stopPropagation(); openMktPost(p); },title:p.titulo},
        (p.ig&&p.ig!=='no')?el('span',{class:'dotp ig'}):'', (p.li&&p.li!=='no')?el('span',{class:'dotp li'}):'',
        el('span',{class:'mkt-cal-txt',text:p.titulo})));
    });
    if(dayPosts.length>3) dots.append(el('div',{class:'mkt-cal-more',text:'+'+(dayPosts.length-3)}));
    cell.append(dots);
    grid.append(cell);
  }
  body.append(grid);
  body.append(el('div',{class:'mkt-cal-leg'},
    el('span',{},el('span',{class:'dotp ig'}),' Instagram'),
    el('span',{},el('span',{class:'dotp li'}),' LinkedIn'),
    el('span',{class:'mkt-cal-hint',text:'clic en un día para agregar'})));
}

/* ---- Editor de publicación ---- */
function openMktPost(post, fechaDefault){
  const M=data.mkt;
  const nuevo=!post;
  const p = post || { id:uid(), titulo:'', fecha:fechaDefault||todayStr(), marca:M.marcas[0]||'', ig:'pend', li:'pend', nota:'' };
  const ov=el('div',{class:'modal-ov',onmousedown:e=>{ if(e.target===ov) ov.remove(); }});
  const tituloInp=el('input',{class:'ask-in',type:'text',value:p.titulo,placeholder:'Ej: Reel Casa 8 Autos'});
  const fechaInp=el('input',{class:'ask-in',type:'date',value:p.fecha||todayStr()});
  const marcaSel=el('select',{class:'ask-in'});
  M.marcas.forEach(m=>{ const o=el('option',{value:m,text:m}); if(m===p.marca)o.selected=true; marcaSel.append(o); });
  const addMarca=el('button',{class:'mkt-addmarca',onclick:()=>{
    askText('Nueva marca:', '', nom=>{ if(!nom) return; if(!M.marcas.includes(nom)){ M.marcas.push(nom); save(); } const o=el('option',{value:nom,text:nom}); o.selected=true; marcaSel.append(o); });
  }},'＋ marca');
  const estadoSel=(val)=>{ const s=el('select',{class:'ask-in'}); MKT_ESTADOS.forEach(([k,label])=>{ const o=el('option',{value:k,text:label}); if(k===val)o.selected=true; s.append(o); }); return s; };
  const igSel=estadoSel(p.ig||'pend');
  const liSel=estadoSel(p.li||'pend');
  const notaInp=el('input',{class:'ask-in',type:'text',value:p.nota||'',placeholder:'Nota o link (opcional)'});

  const guardar=()=>{
    p.titulo=tituloInp.value.trim(); p.fecha=fechaInp.value||todayStr(); p.marca=marcaSel.value;
    p.ig=igSel.value; p.li=liSel.value; p.nota=notaInp.value.trim();
    if(!p.titulo){ tituloInp.focus(); return; }
    if(nuevo) M.posts.push(p);
    save(); ov.remove(); render();
  };

  ov.append(el('div',{class:'modal mkt-modal'},
    el('h4',{text:nuevo?'Nueva publicación':'Editar publicación'}),
    el('label',{class:'mkt-lbl',text:'Título'}), tituloInp,
    el('div',{class:'mkt-2col'},
      el('div',{},el('label',{class:'mkt-lbl',text:'Fecha'}), fechaInp),
      el('div',{},el('label',{class:'mkt-lbl',text:'Marca'}), el('div',{class:'mkt-marca-row'}, marcaSel, addMarca))),
    el('div',{class:'mkt-2col'},
      el('div',{},el('label',{class:'mkt-lbl',text:'Instagram'}), igSel),
      el('div',{},el('label',{class:'mkt-lbl',text:'LinkedIn'}), liSel)),
    el('label',{class:'mkt-lbl',text:'Nota / link'}), notaInp,
    el('div',{class:'m-row'},
      nuevo?'':el('button',{class:'del',onclick:()=>{ if(confirm('¿Eliminar esta publicación?')){ M.posts=M.posts.filter(x=>x!==p); save(); ov.remove(); render(); } }},'Eliminar'),
      el('button',{onclick:()=>ov.remove()},'Cancelar'),
      el('button',{class:'primary',onclick:guardar},'Guardar'))
  ));
  document.body.append(ov);
  setTimeout(()=>tituloInp.focus(),40);
}

function mktFmtFecha(f){ if(!f) return '—'; const d=f.slice(8,10), m=parseInt(f.slice(5,7),10); return d+' '+(M3_F[m-1]||''); }

function editarHorasProyecto(colId, name, currentSec){
  const cur=Math.round((currentSec/3600)*10)/10;
  askText('Horas trabajadas en "'+name+'" (ej: 7 o 7,5):', String(cur).replace('.',','), val=>{
    if(val===null) return;
    const h=parseFloat(String(val).replace(',','.'));
    if(isNaN(h)||h<0){ alert('Escribe un número válido de horas.'); return; }
    const sec=Math.round(h*3600);
    // 1) corrige el total histórico del proyecto
    const ref=findColById(colId);
    if(ref){ ensureMeta(ref.col); ref.col.meta.timeSpent=sec; }
    // 2) limpia las sesiones de ese proyecto (venían infladas) y deja una sola con el total corregido, con la fecha de hoy
    if(!data.timeLog) data.timeLog=[];
    data.timeLog=data.timeLog.filter(x=>x.colId!==colId);
    if(sec>0) data.timeLog.push({ id:uid(), colId:colId, areaId:ref?ref.area.id:null, fecha:todayStr(), sec:sec });
    save(); render();
  });
}

function renderArchivados(root){
  const view=el('div',{class:'today-view arch-view'});
  const items=[];
  data.areas.forEach(a=>a.columns.forEach(c=>{ if(c.archived) items.push({area:a,col:c}); }));
  if(!items.length){
    view.append(el('div',{class:'arch-empty'},
      el('div',{class:'ae-ico',text:'⌦'}),
      el('div',{class:'ae-t',text:'No hay proyectos archivados'}),
      el('div',{class:'ae-s',text:'Cuando termines un proyecto, ábrelo y usa “⌦ Archivar”. Aquí quedarán guardados sin estorbar en el tablero, pero seguirán contando en Finanzas.'})));
    root.append(view); return;
  }
  const tbl=el('div',{class:'arch-tbl'});
  const drawRows=(q)=>{
    tbl.innerHTML='';
    tbl.append(el('div',{class:'arch-row h'},
      el('span',{text:'Proyecto'}),el('span',{text:'Área'}),el('span',{text:'Cobrado'}),el('span',{text:''})));
    const nq=normTxt(q||'');
    const shown=items.filter(({area,col})=> !nq || normTxt(col.name).includes(nq) || normTxt(area.name).includes(nq));
    if(!shown.length){ tbl.append(el('div',{class:'arch-row'},el('span',{class:'ar-area',text:'Sin resultados'}))); return; }
    shown.forEach(({area,col})=>{
      const m=ensureMeta(col); const f=finCalc(m);
      const row=el('div',{class:'arch-row'},
        el('span',{class:'ar-name',onclick:()=>openFicha(area,col),title:'Abrir ficha',text:col.name}),
        el('span',{class:'ar-area',text:area.name}),
        el('span',{class:'ar-cob',text:f.presu>0?(clp(f.cobrado)+' · '+Math.round(f.pct*100)+'%'):'—'}),
        el('div',{class:'ar-acts'},
          el('button',{class:'ar-btn',onclick:()=>openFicha(area,col)},'✎ Ficha'),
          el('button',{class:'ar-btn restore',onclick:()=>{ col.archived=false; render(); }},'↺ Restaurar')));
      tbl.append(row);
    });
  };
  // barra de búsqueda
  const search=el('div',{class:'arch-search'},
    el('span',{class:'as-ico',text:'⌕'}));
  const sInp=el('input',{class:'arch-search-inp',type:'text',placeholder:'Buscar proyecto archivado por nombre o número…'});
  sInp.addEventListener('input',()=>drawRows(sInp.value));
  search.append(sInp);
  view.append(search);
  drawRows('');
  view.append(tbl);
  view.append(el('div',{class:'fin-note',text:'Clic en el nombre o “✎ Ficha” para editar sus datos (abonos, gastos, etc.) sin sacarlo de archivados. “↺ Restaurar” lo devuelve al tablero de pendientes.'}));
  root.append(view);
}

/* ============ FINANZAS ============ */
let FIN_YEAR=null, FIN_MONTH=null;
const MESES_F=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const M3_F=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const CATLBL_F={esp:'Especialista',soft:'Software',ofi:'Oficina',otro:'Otro'};

function finGather(){
  const ingresos=[], gastos=[];
  data.areas.forEach(a=>a.columns.forEach(c=>{
    const m=ensureMeta(c);
    const lista=m.fin.pagosList||[];
    lista.forEach(p=>{ if((p.monto||0)>0) ingresos.push({fecha:p.fecha,proj:c.name,who:c.name,concepto:p.concepto||'abono',monto:p.monto,src:p,ref:{type:'proj',area:a,col:c}}); });
    // respaldo: si no hay abonos pero hay un cobrado antiguo, lo mostramos igual (sin fecha)
    if(!lista.length && (m.fin.cobrado||0)>0){
      const legacy={id:uid(),fecha:null,concepto:'cobrado a la fecha',monto:m.fin.cobrado};
      m.fin.pagosList=[legacy]; m.fin.cobrado=0; // lo convertimos en abono real y editable
      ingresos.push({fecha:null,proj:c.name,who:c.name,concepto:legacy.concepto,monto:legacy.monto,src:legacy,ref:{type:'proj',area:a,col:c}});
    }
    (m.fin.gastosList||[]).forEach(g=>{ if((g.monto||0)>0) gastos.push({fecha:g.fecha,proj:c.name,who:g.who||'—',cat:g.cat||'esp',concepto:g.concepto||'',monto:g.monto,src:g,ref:{type:'proj',area:a,col:c}}); });
  }));
  (data.gastosGenerales||[]).forEach(g=>{ if((g.monto||0)>0) gastos.push({fecha:g.fecha,proj:'',who:g.who||'—',cat:g.cat||'otro',concepto:g.concepto||'',monto:g.monto,src:g,ref:{type:'gen',obj:g}}); });
  // ingresos que aún no sabes a qué proyecto van: cuentan igual en el total
  (data.ingresosGenerales||[]).forEach(g=>{ if((g.monto||0)>0) ingresos.push({fecha:g.fecha,proj:'',who:g.who||g.desc||'Ingreso',concepto:g.concepto||'sin identificar aún',monto:g.monto,src:g,ref:{type:'gen-in',obj:g},sinProy:true}); });
  return {ingresos,gastos};
}
const ym=(f)=>f? {y:+f.slice(0,4), m:+f.slice(5,7)} : null;

/* Mover un ingreso "sin proyecto" a la ficha del proyecto que corresponda */
function asignarIngreso(g){
  const proys=todosLosProyectos();
  const ov=el('div',{class:'modal-ov',onmousedown:e=>{ if(e.target===ov) ov.remove(); }});
  const sel=el('select',{class:'ask-in'});
  sel.append(el('option',{value:'',text:'— elige el proyecto —'}));
  proys.forEach(p=>sel.append(el('option',{value:p.col.id,text:p.col.name})));
  const concepto=el('input',{class:'ask-in',type:'text',value:g.concepto||'abono',placeholder:'anticipo, saldo, abono…'});
  const asignar=()=>{
    const col=(proys.find(p=>p.col.id===sel.value)||{}).col;
    if(!col){ sel.focus(); return; }
    const m=ensureMeta(col);
    if(!m.fin.pagosList) m.fin.pagosList=[];
    m.fin.pagosList.push({id:uid(),fecha:g.fecha,concepto:concepto.value.trim()||'abono',monto:g.monto,ref:g.ref});
    data.ingresosGenerales=(data.ingresosGenerales||[]).filter(x=>x!==g);
    save(); ov.remove(); render();
  };
  const borrar=()=>{
    if(!confirm('¿Quitar este ingreso del registro?')) return;
    data.ingresosGenerales=(data.ingresosGenerales||[]).filter(x=>x!==g);
    save(); ov.remove(); render();
  };
  ov.append(el('div',{class:'modal ask-modal'},
    el('h4',{text:'Asignar ingreso a un proyecto'}),
    el('div',{class:'pers-empty',style:'padding:2px 0 10px',
      text:(g.desc||g.who||'Ingreso')+' · '+clp(g.monto)+(g.fecha?(' · '+g.fecha):'')}),
    el('label',{class:'mkt-lbl',text:'Proyecto'}), sel,
    el('label',{class:'mkt-lbl',text:'Concepto'}), concepto,
    el('div',{class:'m-row'},
      el('button',{class:'pa-ign',onclick:borrar},'Quitar'),
      el('button',{onclick:()=>ov.remove()},'Cancelar'),
      el('button',{class:'primary',onclick:asignar},'Asignar'))
  ));
  document.body.append(ov);
  setTimeout(()=>sel.focus(),40);
}

function renderFinanzas(root){
  const {ingresos,gastos}=finGather();
  const years=new Set();
  ingresos.concat(gastos).forEach(x=>{ const d=ym(x.fecha); if(d) years.add(d.y); });
  const nowY=new Date().getFullYear(); years.add(nowY);
  const yearsArr=[...years].sort();
  if(!FIN_YEAR||!years.has(FIN_YEAR)) FIN_YEAR=nowY;
  if(!FIN_MONTH) FIN_MONTH=new Date().getMonth()+1;

  const view=el('div',{class:'today-view fin-view'});

  // year tabs
  const yt=el('div',{class:'fin-yrs'});
  yearsArr.forEach(y=>yt.append(el('button',{class:'fin-yb'+(y===FIN_YEAR?' on':''),onclick:()=>{FIN_YEAR=y;render();}},String(y))));
  view.append(yt);

  // monthly buckets
  const inM=Array(13).fill(0), outM=Array(13).fill(0);
  ingresos.forEach(x=>{ const d=ym(x.fecha); if(d&&d.y===FIN_YEAR) inM[d.m]+=x.monto; });
  gastos.forEach(x=>{ const d=ym(x.fecha); if(d&&d.y===FIN_YEAR) outM[d.m]+=x.monto; });
  const yin=inM.reduce((a,b)=>a+b,0), yout=outM.reduce((a,b)=>a+b,0), ynet=yin-yout;

  // year summary
  const ysum=el('div',{class:'fin-sum'});
  ysum.append(
    el('div',{class:'fin-mc inc'},el('div',{class:'k',text:'Recibido '+FIN_YEAR}),el('div',{class:'v',text:clp(yin)})),
    el('div',{class:'fin-mc out'},el('div',{class:'k',text:'Gastado '+FIN_YEAR}),el('div',{class:'v',text:clp(yout)})),
    el('div',{class:'fin-mc'},el('div',{class:'k',text:'Neto '+FIN_YEAR}),el('div',{class:'v '+(ynet>=0?'pos':'neg'),text:clp(ynet)}))
  );
  view.append(ysum);

  // --- panel "sin fecha asignada" ---
  const undIn=ingresos.filter(x=>!x.fecha), undOut=gastos.filter(x=>!x.fecha);
  if(undIn.length || undOut.length){
    const undTot=undIn.concat(undOut).reduce((s,x)=>s+x.monto,0);
    const panel=el('div',{class:'fin-und'});
    panel.append(el('div',{class:'fin-und-h'},
      el('span',{class:'fin-und-t',text:'⚠ Sin fecha asignada · '+clp(undTot)}),
      el('span',{class:'fin-und-sub',text:'ponle fecha para que aparezca en su mes'})));
    const setF=(x)=>{
      const inp=el('input',{type:'date',class:'fin-und-date'});
      inp.addEventListener('change',()=>{ if(inp.value){ x.src.fecha=inp.value; save(); render(); } });
      return inp;
    };
    undIn.forEach(x=>{
      panel.append(el('div',{class:'fin-und-row'},
        el('span',{class:'fin-und-tag in',text:'ingreso'}),
        el('span',{class:'fin-und-name',text:x.proj},),
        el('span',{class:'fin-und-con',text:x.concepto}),
        el('span',{class:'fin-und-amt in',text:clp(x.monto)}),
        setF(x)));
    });
    undOut.forEach(x=>{
      panel.append(el('div',{class:'fin-und-row'},
        el('span',{class:'fin-und-tag out',text:'gasto'}),
        el('span',{class:'fin-und-name',text:x.who}),
        el('span',{class:'fin-und-con',text:(x.proj||'general')}),
        el('span',{class:'fin-und-amt out',text:clp(x.monto)}),
        setF(x)));
    });
    view.append(panel);
  }

  // chart
  const card=el('div',{class:'fin-chart'});
  card.append(el('div',{class:'fin-ch-h'},
    el('span',{class:'fin-ch-t',text:'Recibido vs gastado por mes'}),
    el('span',{class:'fin-leg'},
      el('span',{},el('b',{style:'background:var(--today)'}),'Recibido'),
      el('span',{},el('b',{style:'background:var(--p2)'}),'Gastado'))));
  const maxM=Math.max(1,...inM.slice(1),...outM.slice(1));
  const months=el('div',{class:'fin-months'});
  for(let m=1;m<=12;m++){
    const col=el('div',{class:'fin-mcol'+(m===FIN_MONTH?' on':''),onclick:()=>{FIN_MONTH=m;render();}},
      inM[m]>0 ? el('div',{class:'fin-mval',text:clp(inM[m])}) : null,
      el('div',{class:'fin-bars'},
        el('i',{class:'bi',style:'height:'+(inM[m]/maxM*100)+'%'}),
        el('i',{class:'bo',style:'height:'+(outM[m]/maxM*100)+'%'})),
      el('div',{class:'fin-mlab',text:M3_F[m-1]}));
    months.append(col);
  }
  card.append(months);
  view.append(card);
  view.append(el('div',{class:'fin-hint',text:'Haz clic en un mes para ver su detalle abajo ↓'}));

  // detail
  const dIn=ingresos.filter(x=>{const d=ym(x.fecha);return d&&d.y===FIN_YEAR&&d.m===FIN_MONTH;}).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const dOut=gastos.filter(x=>{const d=ym(x.fecha);return d&&d.y===FIN_YEAR&&d.m===FIN_MONTH;}).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const tin=dIn.reduce((s,x)=>s+x.monto,0), tout=dOut.reduce((s,x)=>s+x.monto,0);

  view.append(el('div',{class:'fin-det-h'},
    el('span',{class:'dm',text:MESES_F[FIN_MONTH-1]+' '+FIN_YEAR}),
    el('span',{class:'dnet',text:'neto '+clp(tin-tout)})));

  const cols=el('div',{class:'fin-cols'});
  const dd=(f)=>{ if(!f) return '—'; return f.slice(8,10)+' '+M3_F[(+f.slice(5,7))-1]; };

  // ingresos ledger
  const li=el('div',{class:'fin-ledger inc'});
  li.append(el('div',{class:'fin-lh'},el('span',{class:'lt',text:'Ingresos recibidos'}),el('span',{class:'ltot',text:clp(tin)})));
  if(!dIn.length) li.append(el('div',{class:'fin-empty',text:'Sin ingresos este mes.'}));
  dIn.forEach(x=>{
    const meta=el('div',{class:'fin-imeta'},el('span',{class:'fin-iconcept',text:x.concepto}));
    if(x.sinProy) meta.append(el('span',{class:'sin-proy',title:'Clic para asignarlo a un proyecto',text:'⊙ sin proyecto'}));
    li.append(el('div',{class:'fin-item',onclick:()=>{
        if(x.ref.type==='proj') openFicha(x.ref.area,x.ref.col);
        else if(x.ref.type==='gen-in') asignarIngreso(x.ref.obj);
      }},
      el('div',{class:'fin-idate',text:dd(x.fecha)}),
      el('div',{class:'fin-ibody'},el('div',{class:'fin-iwho',text:x.who}), meta),
      el('div',{class:'fin-iamt',text:clp(x.monto)})));
  });
  cols.append(li);

  // gastos ledger
  const lo=el('div',{class:'fin-ledger out'});
  lo.append(el('div',{class:'fin-lh'},el('span',{class:'lt',text:'Gastos y pagos'}),el('span',{class:'ltot',text:clp(tout)})));
  if(!dOut.length) lo.append(el('div',{class:'fin-empty',text:'Sin gastos este mes.'}));
  dOut.forEach(x=>{
    const meta=el('div',{class:'fin-imeta'},

function handleDrop(area,col,cardsEl,e){
  const id=e.dataTransfer.getData('text/plain');
  // find & remove from origin (search all areas + inbox)
  let task=null;
  for(const a of data.areas) for(const c of a.columns){
    const i=c.tasks.findIndex(x=>x.id===id);
    if(i>-1){ task=c.tasks.splice(i,1)[0]; break; }
    if(task) break;
  }
  if(!task){ const i=data.inbox.findIndex(x=>x.id===id); if(i>-1) task=data.inbox.splice(i,1)[0]; }
  if(!task) return;
  // insertion index based on mouse Y vs card midpoints
  const cardsAfter=[...cardsEl.querySelectorAll('.card:not(.dragging)')];
  let idx=col.tasks.length;
  for(let i=0;i<cardsAfter.length;i++){
    const r=cardsAfter[i].getBoundingClientRect();
    if(e.clientY < r.top+r.height/2){
      const tid=cardsAfter[i].dataset.taskId;
      idx=col.tasks.findIndex(x=>x.id===tid); if(idx<0) idx=col.tasks.length;
      break;
    }
  }
  col.tasks.splice(idx,0,task);
  render();
}

/* inline add */
function openInlineAdd(col,cardsEl,addBtn){
  addBtn.style.display='none';
  const ta=el('textarea',{placeholder:'Nombre de la tarea…',rows:'1'});
  const wrap=el('div',{class:'add-input-wrap'},ta,
    el('div',{class:'add-row'},
      el('button',{class:'cancel',onclick:close},'Cancelar'),
      el('button',{class:'go',onclick:commit},'Añadir')
    ));
  cardsEl.append(wrap);
  ta.focus();
  ta.addEventListener('input',()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); commit(true); }
    if(e.key==='Escape'){ close(); }
  });
  function commit(keepOpen){
    const v=ta.value.trim();
    if(v){ col.tasks.push({id:uid(),text:v,done:false,priority:0,due:null}); }
    if(keepOpen&&v){ save(); ta.value=''; ta.style.height='auto';
      // re-render but reopen
      render(); const cols=[...document.querySelectorAll('.cards')].find(c=>c.dataset.colId===col.id);
      const btn=cols&&cols.parentElement.querySelector('.add-card'); if(btn) openInlineAdd(col,cols,btn);
    } else { render(); }
  }
  function close(){ render(); }
}

/* ===== Resumen por oficina de arquitectura =====
   Agrupa los presupuestos por estudio. Une variantes del mismo nombre
   ("Winteri Arquitectos" y "Winteri Arquitectura" son la misma oficina). */
function oficinaKey(cliente){
  let s=normTxt(cliente||'').replace(/[^a-z0-9\s]/g,' ');
  s=s.replace(/\b(arquitectos?|arquitectura|arquitecta|oficina|estudio|spa|ltda|limitada|y\s+cia|asociados)\b/g,'');
  s=s.replace(/\s+/g,' ').trim();
  return s || '_sin';
}
function renderPorOficina(){
  const wrap=el('div',{class:'ofi-wrap'});
  const ps=(data.presupuestos||[]).filter(p=>p.cliente && p.cliente.trim());
  if(!ps.length) return wrap;

  const g=new Map();
  ps.forEach(p=>{
    const k=oficinaKey(p.cliente);
    if(!g.has(k)) g.set(k,{label:p.cliente.trim(), nombres:{}, enviado:0, nEnv:0, aprobado:0, nApr:0, total:0, n:0});
    const o=g.get(k);
    o.nombres[p.cliente.trim()]=(o.nombres[p.cliente.trim()]||0)+1;
    const m=(p.moneda==='UF')?0:(p.monto||0);   // los UF no se suman con pesos
    o.total+=m; o.n++;
    if(p.estado==='enviado'){ o.enviado+=m; o.nEnv++; }
    else if(p.estado==='aprobado'){ o.aprobado+=m; o.nApr++; }
  });
  // etiqueta = la forma del nombre que más se repite
  g.forEach(o=>{ o.label=Object.keys(o.nombres).sort((a,b)=>o.nombres[b]-o.nombres[a])[0]; });

  const lista=[...g.values()].sort((a,b)=> (b.enviado-a.enviado) || (b.total-a.total));
  wrap.append(el('div',{class:'ofi-t',text:'Por oficina · '+lista.length+' estudio'+(lista.length===1?'':'s')}));
  const fila=el('div',{class:'ofi-row'});
  lista.forEach(o=>{
    const c=el('div',{class:'ofi-chip',title:o.n+' presupuesto'+(o.n===1?'':'s')+' en total · '+clp(o.total)});
    c.append(el('div',{class:'ofi-name',text:o.label}));
    c.append(el('div',{class:'ofi-monto mono',text:clp(o.enviado)}));
    const pie=[];
    pie.push(o.nEnv+' en juego');
    if(o.nApr) pie.push('✓ '+clpShort(o.aprobado));
    c.append(el('div',{class:'ofi-sub',text:pie.join('  ·  ')}));
    fila.append(c);
  });
  wrap.append(fila);
  return wrap;
}

    el('span',{class:'pres-fecha',text:p.fechaEnvio?('env. '+p.fechaEnvio):''})));
  if(p.estado==='caido' && p.motivo) card.append(el('div',{class:'pres-motivo mono',text:'⊘ '+p.motivo}));

  const acts=el('div',{class:'pres-acts'});
  if(p.datos){
    acts.append(el('button',{class:'pa edit',title:'Reabrir en el generador para editar',onclick:()=>editarPresupuesto(p)},'✎ Editar'));
    acts.append(el('button',{class:'pa',title:'Crear una copia (ej: versión sin gas)',onclick:()=>duplicarPresupuesto(p)},'⧉ Duplicar'));
  }
  if(p.estado==='enviado'){
    acts.append(
      el('button',{class:'pa aprob',onclick:()=>aprobarPresupuesto(p)},'✓ Aprobado'),
      el('button',{class:'pa caido',onclick:()=>caerPresupuesto(p)},'✕ Cayó'));
  } else if(p.estado==='aprobado'){
    acts.append(el('button',{class:'pa',onclick:()=>{ p.estado='enviado'; render(); }},'↺ Reabrir'));
  } else if(p.estado==='caido'){
    acts.append(el('button',{class:'pa',onclick:()=>{ p.estado='enviado'; p.motivo=''; render(); }},'↺ Reabrir'));
  }
  acts.append(el('button',{class:'pa del',title:'Eliminar',onclick:()=>{ if(confirm('¿Eliminar "'+p.nombre+'" del embudo?')){ data.presupuestos=data.presupuestos.filter(x=>x!==p); save(); render(); } }},'✕'));
  card.append(acts);
  return card;
}

function renderEmitir(root){

  } else {
    // presupuesto nuevo: fijar el código correlativo en el generador (campo ID → PDF)
    frame.addEventListener('load',()=>{ setTimeout(()=>{ try{ const d=frame.contentDocument; const idf=d&&d.getElementById('i-id'); if(idf){ idf.value=nuevoCodigo; idf.dispatchEvent(new Event('input',{bubbles:true})); if(frame.contentWindow.render) frame.contentWindow.render(); } }catch(e){} }, 500); });
  }
  view.append(frame);
  root.append(view);
}

// Lee TODOS los campos del generador (para poder reabrir y editar después)
const GEN_FIELDS=['i-project','i-id','i-m2','i-lotes','i-client','i-loc','i-owner','i-date','i-uf','i-plazo','i-anticipo','i-saldo','i-paymode','i-pagebreak','i-sig-name','i-sig-role','i-notas','i-tram-type','i-tram-clp'];
function leerDatosGenerador(doc){
  const fields={};
  GEN_FIELDS.forEach(id=>{ const e=doc.getElementById(id); if(e) fields[id]=e.value; });
  const specs={};
  doc.querySelectorAll('[id^="sp-"]').forEach(el=>{
    if(el.id.indexOf('sp-rate-')===0) return;
    const sid=el.id.slice(3);
    const rate=doc.getElementById('sp-rate-'+sid);
    specs[sid]={ on: !!el.checked, rate: rate?parseFloat(rate.value)||0:0 };
  });
  return { fields, specs };
}

// Lee los campos del generador dentro del iframe y crea el presupuesto en el embudo
function emitirAlEmbudoDesdeIframe(){
  const fr=document.getElementById('emitFrame');
  if(!fr||!fr.contentWindow||!fr.contentDocument){ alert('El generador aún no termina de cargar.'); return; }
  const doc=fr.contentDocument;
  const val=id=>{ const e=doc.getElementById(id); return e?e.value:''; };
  const nombre=(val('i-project')||'').trim();
  const cliente=(val('i-client')||'').trim();
  const comuna=(val('i-loc')||'').trim();
  const uf=parseFloat(val('i-uf'))||0;
  const datos=leerDatosGenerador(doc);   // guarda todo para editar después
  // Total: intenta leer el subtotal calculado del documento; si no, avisa
  let montoCLP=0;
  try{
    const totalRow=doc.querySelector('tr.total');
    if(totalRow){
      const cells=totalRow.querySelectorAll('td.num');
      const last=cells[cells.length-1];
      if(last){ montoCLP=parseInt((last.textContent||'').replace(/[^\d]/g,''))||0; }
    }
  }catch(e){}
  if(!nombre){ alert('Ponle nombre al proyecto en el generador antes de enviar.'); return; }
  const finish=(montoCLP)=>{
    let montoUF=0;
    if(uf>0) montoUF=Math.round((montoCLP/uf)*100)/100;
    const editar = EDITING_ID ? (data.presupuestos||[]).find(x=>x.id===EDITING_ID) : null;
    if(editar){
      // Actualizar el MISMO presupuesto, manteniendo número/código y su estado en el embudo
      editar.nombre=nombre; editar.cliente=cliente; editar.comuna=comuna;
      editar.monto=montoCLP; editar.moneda='CLP'; editar.uf=montoUF;
      editar.datos=datos; editar.fechaEnvio=todayStr();
      save();
      const cod = editar.numero ? ('N° '+fmtPresupCodigo(editar.numero)+' · ') : '';
      alert(cod+'"'+nombre+'" actualizado por '+clp(montoCLP)+(montoUF?(' ('+montoUF.toLocaleString('es-CL',{maximumFractionDigits:1})+' UF)'):'')+'.\n\nSe mantuvo el mismo presupuesto y su código. Si aún no lo hiciste, genera el PDF desde el generador.');
    } else {
      const numero = nextPresupNumero();
      data.presupuestos.unshift({
        id:uid(), numero, codigo:fmtPresupCodigo(numero), nombre, cliente, comuna,
        monto:montoCLP, moneda:'CLP', fechaEnvio:todayStr(), estado:'enviado', motivo:'',
        uf:montoUF, datos:datos
      });
      save();
      alert('N° '+fmtPresupCodigo(numero)+' · "'+nombre+'" enviado al embudo por '+clp(montoCLP)+(montoUF?(' ('+montoUF.toLocaleString('es-CL',{maximumFractionDigits:1})+' UF)'):'')+'.\n\nQuedó guardado con todos sus datos: puedes reabrirlo y editarlo desde el embudo.');
    }
    EDITING_ID=null;
    data.ui.view='presupuestos'; render();
  };
  if(!montoCLP){
    askText('No pude leer el total automáticamente. Escribe el monto total en CLP (solo números):','',manual=>{
      if(manual===null) return;
      finish(parseInt(manual.replace(/[^\d]/g,''))||0);
    });
  } else {
    finish(montoCLP);
  }
}

// ---- Reabrir un presupuesto guardado en el generador para editarlo ----
let PENDING_PRESUP=null;
function editarPresupuesto(p){
  if(!p.datos){ alert('Este presupuesto se creó antes de la función de edición, así que no tiene los datos guardados. Los presupuestos que emitas de ahora en adelante sí se podrán editar.'); return; }
  PENDING_PRESUP=p;
  EDITING_ID=p.id;                   // al enviar, se actualiza este mismo presupuesto
  data.ui.view='emitir'; render();   // renderEmitir aplicará los datos al cargar el iframe
}
function aplicarDatosGenerador(fr, datos){
  if(!fr||!fr.contentDocument||!datos) return;
  const doc=fr.contentDocument;
  const fire=(el,type)=>el.dispatchEvent(new Event(type,{bubbles:true}));
  // 1) especialidades primero (para que la firma automática no pise la guardada)
  Object.keys(datos.specs||{}).forEach(sid=>{
    const cb=doc.getElementById('sp-'+sid), rt=doc.getElementById('sp-rate-'+sid);
    if(cb){ cb.checked=!!datos.specs[sid].on; fire(cb,'change'); }
    if(rt){ rt.value=datos.specs[sid].rate; fire(rt,'input'); }
  });
  // 2) campos (firma al final para que gane la guardada)
  const orden=GEN_FIELDS.filter(id=>id!=='i-sig-name'&&id!=='i-sig-role').concat(['i-sig-name','i-sig-role']);
  orden.forEach(id=>{
    if(!(id in (datos.fields||{}))) return;
    const e=doc.getElementById(id); if(!e) return;
    e.value=datos.fields[id];
    fire(e, e.tagName==='SELECT'?'change':'input');
  });
  try{ if(fr.contentWindow.render) fr.contentWindow.render(); }catch(e){}
  // reafirmar la UF guardada por si el fetch automático la pisó
  const savedUF=(datos.fields||{})['i-uf'];
  if(savedUF){ setTimeout(()=>{ try{ const u=doc.getElementById('i-uf'); if(u){ u.value=savedUF; fire(u,'input'); if(fr.contentWindow.render) fr.contentWindow.render(); } }catch(e){} }, 1600); }
}
function duplicarPresupuesto(p){
  const copia=JSON.parse(JSON.stringify(p));
  copia.id=uid(); copia.nombre=p.nombre+' (copia)'; copia.estado='enviado'; copia.motivo=''; copia.fechaEnvio=todayStr();
  const numero=nextPresupNumero(); copia.numero=numero; copia.codigo=fmtPresupCodigo(numero);
  if(copia.datos && copia.datos.fields){ copia.datos.fields['i-id']=copia.codigo; }   // el PDF de la copia lleva el código nuevo
  const idx=data.presupuestos.indexOf(p);
  data.presupuestos.splice(idx>=0?idx:0,0,copia); save(); render();
}

/* ===== TEMPORIZADOR POR PROYECTO ===== */
let TIMER_INT=null;
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')
             : String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtSpent(sec){
  sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  if(h>0) return h+'h '+String(m).padStart(2,'0')+'m';
  if(m>0) return m+'m';
  return Math.round(sec)+'s';
}
// horas decimales redondeadas a la media hora → "8,5 h"
function fmtHrs(sec, dec){
  const h=(sec||0)/3600;
  const r = (dec===1) ? Math.round(h*10)/10 : Math.round(h*2)/2;
  return r.toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})+' h';
}
function timerElapsed(t){ return (t.elapsedBefore||0) + (t.running ? (Date.now()-t.startedAt)/1000 : 0); }
function findColById(colId){
  for(const a of data.areas){ const c=a.columns.find(x=>x.id===colId); if(c) return {area:a,col:c}; }
  return null;
}
function timerLogAndClear(){
  const t=data.ui.timer; if(!t) return;
  const spent=timerElapsed(t);
  const ref=findColById(t.colId);
  if(ref){
    ensureMeta(ref.col);
    ref.col.meta.timeSpent=(ref.col.meta.timeSpent||0)+spent;
    if(!data.timeLog) data.timeLog=[];
    if(spent>=30){ // ignora toques accidentales de menos de 30 segundos
      data.timeLog.push({ id:uid(), colId:t.colId, areaId:ref.area.id, fecha:todayStr(), sec:spent });
    }
  }
  data.ui.timer=null; save();
}
function timerStart(area,col,durationSec){
  if(data.ui.timer) timerLogAndClear();
  try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
  data.ui.timer={ areaId:area.id, colId:col.id, label:col.name, startedAt:Date.now(), elapsedBefore:0, durationSec:durationSec||0, running:true, done:false };
  save(); ensureTimerWidget();
}
function timerPauseResume(){
  const t=data.ui.timer; if(!t) return;
  if(t.running){ t.elapsedBefore=timerElapsed(t); t.running=false; }
  else { t.startedAt=Date.now(); t.running=true; }
  save(); ensureTimerWidget();
}
function timerStop(){ timerLogAndClear(); ensureTimerWidget(); render(); }
function timerBeep(){
  try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(); const g=ac.createGain();
    o.connect(g); g.connect(ac.destination); o.type='sine'; o.frequency.value=880; g.gain.value=0.09;
    o.start(); setTimeout(()=>{o.frequency.value=660;},180); setTimeout(()=>{o.stop();ac.close();},420);
  }catch(e){}
}
function openTimerStart(area,col){
  const ov=el('div',{class:'modal-ov',onmousedown:e=>{if(e.target===ov)ov.remove();}});
  const opt=(label,sec)=>el('button',{class:'tmr-opt',onclick:()=>{ ov.remove(); timerStart(area,col,sec); }},label);
  ov.append(el('div',{class:'modal tmr-modal'},
    el('h4',{text:'Temporizador · '+col.name}),
    el('div',{class:'tmr-opts'},
      opt('25 min',25*60), opt('30 min',30*60), opt('45 min',45*60), opt('1 hora',60*60),
      el('button',{class:'tmr-opt wide',onclick:()=>{ ov.remove(); timerStart(area,col,0); }},'⏱ Cronómetro (contar hacia arriba)')),
    el('div',{class:'m-row'}, el('button',{onclick:()=>ov.remove()},'Cancelar'))
  ));
  document.body.append(ov);
}
function ensureTimerWidget(){
  let w=document.getElementById('tmrWidget');
  const t=data.ui.timer;
  if(window.rcTimer && window.rcTimer.update){ try{ window.rcTimer.update(t||null); }catch(e){} }
  if(!t){ if(w) w.remove(); if(TIMER_INT){ clearInterval(TIMER_INT); TIMER_INT=null; } return; }
  if(!w){ w=el('div',{class:'tmr-widget',id:'tmrWidget'}); document.body.append(w); }
  drawTimerWidget();
  if(!TIMER_INT) TIMER_INT=setInterval(drawTimerWidget,1000);
}
const BASE_TITLE='rojas.casanova · tablero';
function drawTimerWidget(){
  const w=document.getElementById('tmrWidget'); const t=data.ui.timer;
  if(!w||!t){ if(w)w.remove(); if(TIMER_INT){clearInterval(TIMER_INT);TIMER_INT=null;} document.title=BASE_TITLE; return; }
  const elp=timerElapsed(t);
  let big, sub, warn=false;
  if(t.durationSec>0){
    const rem=t.durationSec-elp;
    if(rem<=0){
      // El tiempo se cumplió: detener AQUÍ y registrar exactamente la duración fijada.
      // (Nunca sigue sumando, aunque la app haya quedado abierta o cerrada.)
      t.running=false; t.elapsedBefore=t.durationSec;   // fija el tiempo exacto
      if(!t.done){ timerBeep(); if(navigator.vibrate)navigator.vibrate(300);
        try{ if(window.Notification && Notification.permission==='granted') new Notification('⏱ Tiempo cumplido', {body:t.label+' · '+fmtClock(t.durationSec), tag:'rc-timer'}); }catch(e){}
      }
      t.done=true;
      timerLogAndClear();          // registra la duración exacta y limpia el timer
      ensureTimerWidget(); render();
      return;
    }
    big=fmtClock(Math.max(0,rem)); sub='de '+fmtClock(t.durationSec); warn=rem<=60;
  } else { big=fmtClock(elp); sub='cronómetro'; }
  // conteo en el título de la ventana (visible en la barra de tareas aunque esté minimizada)
  document.title = (t.done?'✓ ':(t.running?'⏱ ':'⏸ ')) + big + ' · ' + t.label;
  w.innerHTML=''; w.classList.toggle('done', !!t.done);
  w.append(
    el('div',{class:'tw-head'},
      el('span',{class:'tw-dot'+(t.running?' run':'')}),
      el('span',{class:'tw-name',title:'Ir al proyecto',onclick:()=>{ const r=findColById(t.colId); if(r) goToProject(r.area,r.col); },text:t.label}),
      el('button',{class:'tw-x',title:'Detener y registrar',onclick:()=>timerStop()},'✕')),
    el('div',{class:'tw-time'+(warn?' warn':'')},big),
    el('div',{class:'tw-sub',text:sub}),
    el('div',{class:'tw-ctr'},
      el('button',{class:'tw-btn',onclick:()=>timerPauseResume()}, t.running?'⏸ Pausar':'▶ Seguir'),
      el('button',{class:'tw-btn stop',onclick:()=>timerStop()},'■ Terminar'))
  );
}

/* ===== BUSCADOR DE PROYECTOS ===== */
function normTxt(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function goToProject(area,col){
  data.ui.currentAreaId=area.id; data.ui.view='board'; render();
  setTimeout(()=>{
    const elc=document.querySelector('.column[data-col-id="'+col.id+'"]');
    if(elc){ elc.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
      elc.classList.add('flash'); setTimeout(()=>elc.classList.remove('flash'),1400); }
  },60);
}
function openSearch(){
  if(document.getElementById('searchOv')) return;
  const ov=el('div',{class:'search-ov',id:'searchOv'});
  const box=el('div',{class:'search-box'});
  const inp=el('input',{class:'search-inp',type:'text',placeholder:'Buscar proyecto por nombre o número…'});
  const list=el('div',{class:'search-list'});
  box.append(inp,list); ov.append(box); document.body.append(ov);
  const close=()=>ov.remove();
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });

  // universo de proyectos
  const all=[];
  data.areas.forEach(a=>a.columns.forEach(c=>all.push({area:a,col:c})));

  let sel=0, current=[];
  function draw(){
    const q=normTxt(inp.value.trim());
    current = all.filter(x=> !q || normTxt(x.col.name).includes(q))
      .sort((A,B)=> (A.col.archived?1:0)-(B.col.archived?1:0))
      .slice(0,40);
    list.innerHTML='';
    if(!current.length){ list.append(el('div',{class:'search-empty',text:'Sin resultados'})); return; }
    current.forEach((x,i)=>{
      const m=ensureMeta(x.col); const f=finCalc(m);
      const pend=x.col.tasks.filter(t=>!t.done).length;
      const bits=[];
      if(x.col.archived) bits.push('archivado');
      bits.push(x.area.name);
      if(m.anticipo && !m.rev0) bits.push(daysBetween(m.anticipo)+'d');
      if(f.presu>0) bits.push('cobrado '+Math.round(f.pct*100)+'%');
      if(pend) bits.push(pend+' pend.');
      const row=el('div',{class:'search-row'+(i===sel?' on':''),
        onmouseenter:()=>{ sel=i; hi(); },
        onclick:()=>{ close(); if(x.col.archived) openFicha(x.area,x.col); else goToProject(x.area,x.col); }},
        el('span',{class:'sr-name',text:x.col.name}),
        el('span',{class:'sr-meta',text:bits.join(' · ')}),
        el('button',{class:'sr-ficha',title:'Abrir ficha',onclick:(e)=>{ e.stopPropagation(); close(); openFicha(x.area,x.col); }},'✎'));
      list.append(row);
    });
  }
  function hi(){ [...list.children].forEach((c,i)=>c.classList.toggle('on',i===sel)); }
  inp.addEventListener('input',()=>{ sel=0; draw(); });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ close(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,current.length-1); hi(); ensureVis(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); hi(); ensureVis(); }
    else if(e.key==='Enter'){ const x=current[sel]; if(x){ close(); if(x.col.archived) openFicha(x.area,x.col); else goToProject(x.area,x.col); } }
  });
  function ensureVis(){ const r=list.children[sel]; if(r) r.scrollIntoView({block:'nearest'}); }
  draw(); setTimeout(()=>inp.focus(),30);
}

function toggleDone(){ data.ui.hideDone=!data.ui.hideDone; render(); }

/* zoom */
function applyZoom(){
  const z=data.ui.zoom||1;
  const b=document.querySelector('.board'); if(b) b.style.zoom=z;
  const v=document.getElementById('zoomVal'); if(v) v.textContent=Math.round(z*100)+'%';
}
function zoomStep(dir){
  data.ui.zoom=Math.min(1.6, Math.max(0.5, Math.round(((data.ui.zoom||1)+dir*0.1)*100)/100));
  applyZoom(); save();
}
function zoomReset(){ data.ui.zoom=1; applyZoom(); save(); }
function zoomFit(){
  const sc=document.querySelector('.board-scroll'), b=document.querySelector('.board');
  if(!sc||!b) return;
  b.style.zoom=1;                                   // medir a escala real
  const need=b.scrollWidth, have=sc.clientWidth;
  let z = need>have ? have/need : 1;
  z=Math.min(1, Math.max(0.5, Math.floor(z*100)/100));
  data.ui.zoom=z; applyZoom(); save();
}
