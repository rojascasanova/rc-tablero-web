<script>
  window.RC_VERSION = '1.1.9';   // subir esto en cada versión nueva
  // Conexión a tu base de datos Supabase (tablero-rc)
  window.RC_SUPABASE_URL  = 'https://sdzybsyxyfbyrynhumig.supabase.co';
  window.RC_SUPABASE_ANON = 'sb_publishable_ycU09SDH1kMB5PqnfzkguQ_TIVFvmw-';

  // ---- Auto-refresco de la versión web (teléfono) ----------------------
  // El teléfono guarda el index.html en su caché y puede quedarse pegado en
  // una versión vieja. Aquí preguntamos por un archivo diminuto (version.json)
  // que nunca se cachea; si allá hay una versión distinta a la que se está
  // ejecutando, recargamos con una dirección nueva y el teléfono baja la
  // versión fresca. En la app de escritorio esto no corre.
  (function(){
    try{
      if(window.rcApp) return;                       // escritorio: no aplica
      if(location.protocol === 'file:') return;
      var yaIntente = new URLSearchParams(location.search).get('rcv');
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if(!j || !j.v) return;
          if(j.v === window.RC_VERSION) return;      // ya estamos al día
          if(yaIntente === j.v){                     // ya recargamos y no cambió
            window.RC_CACHE_PEGADA = j.v;
            return;
          }
          location.replace(location.pathname + '?rcv=' + encodeURIComponent(j.v));
        })
        .catch(function(){});
    }catch(e){}
  })();
</script>

<style>
:root{
  --bg:#1b1815; --sidebar:#161310; --panel:#242018; --panel-2:#2b2619;
  --paper:#e8e4d8; --dim:#9a9284; --faint:#6b6458; --line:rgba(232,228,216,.09);
  --line-strong:rgba(232,228,216,.16); --dotgrid:rgba(232,228,216,.05);
  --p1:#c0574a; --p2:#c99148; --p3:#6d8a9c; --today:#7fb2ab;
  --band-ok:#9a9284; --band-warn:#c99148; --band-late:#cf7a3a; --band-alert:#d8483a;
  --card:#221e17; --card-hover:#2a2519;
}
:root[data-theme="paper"]{
  --bg:#e8e4d8; --sidebar:#ddd8c9; --panel:#f3f0e8; --panel-2:#eae5d9;
  --paper:#2b2620; --dim:#7a7266; --faint:#a49b8b; --line:rgba(43,38,32,.12);
  --line-strong:rgba(43,38,32,.22); --dotgrid:rgba(43,38,32,.06);
  --p1:#b04a3e; --p2:#b07d34; --p3:#4f6f82; --today:#3f7c76;
  --band-ok:#a49b8b; --band-warn:#b07d34; --band-late:#bd6a2c; --band-alert:#c0402f;
  --card:#fbf9f3; --card-hover:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--paper); overflow:hidden;
  background-image:radial-gradient(var(--dotgrid) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

#app{display:grid;grid-template-columns:246px 1fr;grid-template-rows:100vh;height:100vh;overflow:hidden}

/* ---------- SIDEBAR ---------- */
#sidebar{
  background:var(--sidebar);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 0;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px}
.brand .rc{
  width:30px;height:30px;border:1.5px solid var(--paper);border-radius:6px;
  display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;
  font-weight:500;font-size:12px;letter-spacing:.5px;flex-shrink:0;
}
.brand .name{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.5px}
.brand .name small{display:block;color:var(--faint);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

.nav{padding:0 12px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:8px 8px;border-radius:7px;font-size:13.5px;color:var(--paper);
  transition:background .12s;position:relative;
}
.nav-item:hover{background:var(--panel)}
.nav-item.active{background:var(--panel)}
.nav-item .ico{width:16px;color:var(--dim);flex-shrink:0;display:grid;place-items:center}
.nav-item.active .ico{color:var(--today)}
.nav-item .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.nav-item.add{color:var(--today);font-weight:500}

.section-label{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--faint);padding:22px 20px 8px;
  display:flex;justify-content:space-between;align-items:center;
}
.section-label button{color:var(--faint);font-size:15px;line-height:1;padding:0 4px}
.section-label button:hover{color:var(--paper)}
.projects{overflow-y:auto;flex:1}
.proj-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:7px 8px;border-radius:7px;font-size:13.5px;transition:background .12s;
}
.proj-item:hover{background:var(--panel)}
.proj-item.active{background:var(--panel)}
.proj-item .hash{color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:13px;width:14px;text-align:center}
.proj-item.active .hash{color:var(--today)}
.proj-item .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-item .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}

.side-footer{padding:14px 16px 0;border-top:1px solid var(--line);margin:12px 12px 0;display:flex;gap:8px;flex-wrap:wrap}
.side-footer button{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;
  color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:5px 8px;
}
.side-footer button:hover{color:var(--paper);border-color:var(--line-strong)}

/* ---------- MAIN ---------- */
#main{display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:26px 34px 18px;gap:20px;
}
.topbar .title-wrap h1{
  font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:34px;
  line-height:1;letter-spacing:-.5px;
}
.topbar .title-wrap .sub{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;
  color:var(--dim);margin-top:9px;text-transform:uppercase;
}
.clock-wrap{text-align:right;flex-shrink:0}
.clock-wrap .day{font-family:'Fraunces',Georgia,serif;font-size:15px;color:var(--dim);text-transform:capitalize}
.clock-wrap .date-big{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:500;line-height:1;margin-top:2px}
.clock-wrap .clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);letter-spacing:1px;margin-top:6px}
.topbar-actions{display:flex;gap:8px;align-items:center;margin-left:6px}
/* franja de plata bajo el subtítulo */
.platabar{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.pchip{display:flex;flex-direction:column;gap:1px;padding:5px 11px 6px;
  border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02);cursor:default}
.pchip .pv{font-size:14px;font-weight:500;letter-spacing:.2px;line-height:1.15}
.pchip .pl{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.pc-cobrar .pv{color:var(--p2,#c99148)}
.pc-riesgo .pv{color:var(--p1,#c0574a)}
.pc-ok .pv{color:var(--today,#7fb2ab)}
.zoom-ctl{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;height:34px}
.zoom-ctl button{width:28px;height:28px;border-radius:6px;color:var(--dim);font-size:16px;line-height:1;display:grid;place-items:center}
.zoom-ctl button:hover{color:var(--paper);background:var(--panel)}
.zoom-ctl button.fit{font-size:14px}
.zoom-ctl #zoomVal{font-size:11px;color:var(--dim);min-width:38px;text-align:center;letter-spacing:.3px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:15px}
.icon-btn:hover{color:var(--paper);border-color:var(--line-strong);background:var(--panel)}

.board-scroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:6px 34px 30px}
.board{display:flex;gap:16px;height:100%;align-items:flex-start;min-width:min-content}
/* modo empaquetado (masonry por lanes): proyectos cortos se apilan */
.board.packed{display:flex;gap:16px;align-items:flex-start;height:auto;min-width:min-content}
.board.packed .lane{display:flex;flex-direction:column;gap:16px;width:300px;flex-shrink:0}
.board.packed .column{width:300px;max-height:none;flex-shrink:0}
.column{
  width:300px;flex-shrink:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--band-ok);
  border-radius:12px;
  padding:8px 8px 6px;
  display:flex;flex-direction:column;max-height:100%;
  transition:border-color .15s;
}
.column.band-warn{border-left-color:var(--band-warn)}
.column.band-late{border-left-color:var(--band-late)}
.column.band-alert{border-left-color:var(--band-alert)}
.column.band-closed{border-left-color:var(--today)}
.column.band-none{border-left-color:var(--line)}
.col-head{display:flex;align-items:center;gap:7px;padding:2px 4px 10px}
.col-grip{color:var(--faint);font-size:13px;cursor:grab;opacity:0;line-height:1;padding:0 1px;user-select:none}
.column:hover .col-grip{opacity:.7}
.col-grip:hover{color:var(--paper);opacity:1}
.col-head .cname{font-weight:600;font-size:14.5px;letter-spacing:-.2px;outline:none}
.col-head .cname:focus{border-bottom:1px solid var(--line-strong)}
.col-head .ccount{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.col-actions{margin-left:auto;display:flex;gap:1px;opacity:0}
.column:hover .col-actions{opacity:1}
.col-actions button{color:var(--faint);font-size:14px;line-height:1;padding:2px 4px;border-radius:5px}
.col-actions button:hover{color:var(--paper);background:var(--panel-2)}
.col-actions button.del:hover{color:var(--p1)}
.cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 8px;min-height:8px}
.cards.drag-over{background:var(--dotgrid);border-radius:8px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px 11px 12px;display:flex;gap:10px;align-items:flex-start;
  position:relative;transition:background .12s,border-color .12s,box-shadow .12s;
  cursor:grab;
}
.card:hover{background:var(--card-hover);border-color:var(--line-strong);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.card.p1{border-left:3px solid var(--p1)}
.card.p2{border-left:3px solid var(--p2)}
.card.p3{border-left:3px solid var(--p3)}
.card.done{opacity:.5}
.card.dragging{opacity:.35}
.check{
  width:19px;height:19px;border-radius:50%;border:1.6px solid var(--faint);
  flex-shrink:0;margin-top:1px;display:grid;place-items:center;transition:.12s;
}
.check:hover{border-color:var(--today)}
.card.p1 .check{border-color:var(--p1)}
.card.done .check{background:var(--today);border-color:var(--today)}
.check svg{width:11px;height:11px;stroke:var(--bg);stroke-width:2.5;fill:none;opacity:0;transition:.12s}
.card.done .check svg{opacity:1}
.card-body{flex:1;min-width:0}
.card-text{font-size:13.5px;line-height:1.42;word-wrap:break-word;outline:none}
.card.done .card-text{text-decoration:line-through;color:var(--dim)}
.card-meta{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.due-chip{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);
  display:inline-flex;align-items:center;gap:4px;letter-spacing:.3px;
}
.due-chip.today{color:var(--today);font-weight:500}
.due-chip.overdue{color:var(--p1)}
.card-tools{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:.12s}
.card:hover .card-tools{opacity:1}
.card-tools button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--faint);font-size:12px}
.card-tools button:hover{color:var(--paper);background:var(--panel-2)}
.flag-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.add-card{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  color:var(--faint);font-size:13px;transition:.12s;margin-top:2px;
}
.add-card:hover{background:var(--panel);color:var(--paper)}
.add-card .plus{font-size:15px;line-height:1}
.add-input-wrap{background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:10px}
.add-input-wrap textarea{
  width:100%;background:none;border:none;color:var(--paper);font-size:13.5px;
  resize:none;outline:none;line-height:1.4;min-height:20px;
}
.add-input-wrap .add-row{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.add-input-wrap .add-row button{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 11px;border-radius:6px}
.add-input-wrap .add-row .go{background:var(--today);color:var(--bg);font-weight:500}
.add-input-wrap .add-row .cancel{color:var(--dim)}

.add-column{
  width:270px;flex-shrink:0;color:var(--faint);font-size:13.5px;padding:6px;
  display:flex;align-items:center;gap:8px;border-radius:10px;height:44px;
}
.add-column:hover{background:var(--panel);color:var(--paper)}

.nav-arrow{
  position:absolute;top:calc(50% + 30px);transform:translateY(-50%);
  width:42px;height:42px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line-strong);color:var(--paper);display:grid;place-items:center;
  font-size:20px;line-height:1;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.28);
  opacity:.9;transition:opacity .12s,background .12s;
}
.nav-arrow:hover{opacity:1;background:var(--panel-2)}
.nav-arrow.left{left:14px}
.nav-arrow.right{right:14px}
.board-scroll.grabbable{cursor:grab}
.board-scroll.grabbing{cursor:grabbing}

/* ---------- HOY VIEW ---------- */
#mainContent{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.today-view{flex:1;min-height:0;overflow-y:auto;padding:4px 34px 40px}
.today-group{margin-bottom:26px;max-width:720px}
.today-group h3{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.today-group h3 .g-count{color:var(--faint)}
.today-empty{color:var(--faint);font-size:14px;padding:40px 0;text-align:center;max-width:720px}
.today-empty .big{font-family:'Fraunces',serif;font-size:22px;color:var(--dim);display:block;margin-bottom:8px}

/* modal JSON */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:100}
.modal{background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;width:min(560px,90vw);max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modal h4{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.modal textarea{width:100%;height:240px;background:var(--bg);color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;resize:vertical;outline:none}
.modal .m-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .m-row button{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-strong);color:var(--paper)}
.modal .m-row button.primary{background:var(--today);color:var(--bg);border-color:var(--today);font-weight:500}
.modal .m-row button:hover{background:var(--panel-2)}
.modal .m-row button.primary:hover{opacity:.9;background:var(--today)}
.modal .hint{color:var(--faint);font-size:11px;margin-top:12px;line-height:1.55}

/* ---------- FICHA DE PROYECTO ---------- */
.proj-meta{
  border:none;border-radius:8px;background:transparent;
  padding:2px 4px 11px;margin:0 0 8px;cursor:pointer;
  border-bottom:1px solid var(--line);transition:background .12s;
}
.proj-meta:hover{background:var(--panel-2)}
.pm-top{display:flex;align-items:baseline;gap:8px}
.pm-days{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;line-height:1;letter-spacing:-.5px;color:var(--band-ok)}
.pm-days.warn{color:var(--band-warn)}
.pm-days.late{color:var(--band-late)}
.pm-days.alert{color:var(--band-alert)}
.pm-days.closed{color:var(--today)}
.pm-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.pm-revs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.rev-chip{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.4px;
  border:1px solid var(--line);border-radius:5px;padding:2.5px 6px;color:var(--faint);
}
.rev-chip.done{color:var(--paper);border-color:var(--line-strong);background:var(--panel-2)}
.rev-chip.final.done{color:var(--today);border-color:var(--today)}
.pm-team{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.team-chip{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);
  background:var(--panel-2);border-radius:5px;padding:2.5px 6px;letter-spacing:.3px;
}
.pm-empty{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);letter-spacing:.5px}
.pm-money{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.pm-money-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pmm-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
.pmm-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500}
.pmm-val.good{color:var(--today)}
.pmm-val.mid{color:var(--p2)}
.pmm-val.low{color:var(--p1)}
.pm-money-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);margin-top:3px;letter-spacing:.2px}
.pm-bar{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.pm-bar>i{display:block;height:100%;background:var(--today);border-radius:3px;transition:width .35s ease}
.pm-bar.low>i{background:var(--p1)}
.pm-bar.mid>i{background:var(--p2)}
.pm-bar.good>i{background:var(--today)}

.ficha .f-sep2{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin-top:2px}
.pagos-wrap{display:flex;flex-direction:column;gap:8px}
.pago-card{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.pago-head{display:flex;align-items:center;gap:10px;padding:8px 10px 6px}
.pago-num{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--paper);letter-spacing:.5px}
.pago-pct{flex:1;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--today)}
.pago-body{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:0 10px 10px}
.pago-f{display:flex;flex-direction:column;gap:4px}
.pago-f label{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.pago-f input,.pago-f select{background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--paper);padding:7px 9px;font-size:12px;outline:none;font-family:'IBM Plex Mono',monospace;color-scheme:dark;width:100%}
:root[data-theme="paper"] .pago-f input,:root[data-theme="paper"] .pago-f select{color-scheme:light}
.pago-f input:focus,.pago-f select:focus{border-color:var(--line-strong)}
.pago-f .pago-monto{text-align:right}
.pago-del{color:var(--faint);font-size:16px;line-height:1;border-radius:6px;height:26px;width:26px;flex-shrink:0}
.pago-del:hover{color:var(--p1);background:var(--panel-2)}
.pago-tot{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel-2);font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--paper);margin-top:2px}
.pago-tot .mono{color:var(--today);font-weight:500}
.pago-empty{font-size:12px;color:var(--faint);padding:10px 2px;font-style:italic}
.pago-add{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--today);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:2px;align-self:flex-start}
.pago-add:hover{border-color:var(--today);background:var(--panel)}
/* variante gasto (egresos) */
.pago-card.gasto .pago-pct.out{color:var(--p2)}
.pago-body.g4{grid-template-columns:1fr 1.3fr 1fr 1fr}
.pago-tot.gasto{border-color:var(--p2)}
.pago-tot.gasto .mono{color:var(--p2)}


/* ficha modal */
.ficha .f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:4px}
.ficha .f-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.ficha .f-field .f-row{display:flex;gap:6px;align-items:center}
.ficha input[type=date],.ficha input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  color:var(--paper);padding:7px 9px;font-size:12.5px;outline:none;
  font-family:'IBM Plex Mono',monospace;color-scheme:dark;
}
:root[data-theme="paper"] .ficha input[type=date],:root[data-theme="paper"] .ficha input[type=text]{color-scheme:light}
.ficha input:focus{border-color:var(--line-strong)}
.ficha .hoy-btn{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:6px 8px;flex-shrink:0}
.ficha .hoy-btn:hover{color:var(--today);border-color:var(--today)}
.ficha .f-sep{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.ficha .f-resumen{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);line-height:1.7;background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.ficha .f-field-full{grid-column:1/-1}
.ficha .f-nota{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--paper);
  padding:9px 11px;font-size:12.5px;outline:none;font-family:'IBM Plex Sans',sans-serif;line-height:1.5;resize:vertical;min-height:64px}
.ficha .f-nota:focus{border-color:var(--line-strong)}

/* nómina */
.nomina{max-width:980px;margin-bottom:22px}
.nom-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.nom-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nom-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
.nom-chip button{color:var(--faint);font-size:13px;line-height:1;padding:0 1px}
.nom-chip button:hover{color:var(--p1)}
.nom-add{display:inline-flex;gap:6px;align-items:center}
.nom-input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:6px 10px;font-size:12.5px;outline:none;width:180px}
.nom-input:focus{border-color:var(--line-strong)}
.nom-add-btn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--today);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.nom-add-btn:hover{border-color:var(--today)}

/* vista equipo */
.equipo-table{max-width:980px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.eq-row{display:grid;grid-template-columns:1.5fr .6fr 1fr 1fr 1fr 1fr;gap:0;border-top:1px solid var(--line);align-items:center}
.equipo-table.fin .eq-row{grid-template-columns:1.5fr .55fr .9fr .9fr .9fr .9fr .9fr}
.eq-row.total{background:var(--panel);border-top:2px solid var(--line-strong)}
.eq-row.total .eq-proj{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px}
.eq-mi{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;color:var(--today);padding:10px 14px}
.eq-mi small{display:block;font-weight:400;color:var(--faint);font-size:10px;margin-top:2px}
.eq-row:first-child{border-top:none}
.eq-row.head{background:var(--panel)}
.eq-row>div{padding:10px 14px;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-row.head>div{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.eq-row .eq-proj{font-weight:600}
.eq-row .eq-proj small{display:block;font-weight:400;color:var(--faint);font-size:10.5px;font-family:'IBM Plex Mono',monospace;margin-top:2px}
.eq-row .eq-days{font-family:'IBM Plex Mono',monospace;color:var(--dim)}
.eq-row .eq-days.late{color:var(--p1)}
.eq-row .eq-days.closed{color:var(--today)}
.eq-row .eq-person{color:var(--dim)}
.eq-row .eq-person.set{color:var(--paper)}
.eq-row:not(.head):hover{background:var(--panel)}
.eq-row:not(.head){cursor:pointer}

/* embudo de presupuestos */
.pres-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;max-width:1100px}
.pres-in{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:8px 11px;font-size:13px;outline:none;flex:1;min-width:120px}
.pres-in:focus{border-color:var(--line-strong)}
.pres-add-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--bg);background:var(--today);border-radius:8px;padding:9px 14px;font-weight:500}
.pres-add-btn:hover{opacity:.9}
.pres-resumen{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-bottom:12px}
/* resumen por oficina de arquitectura */
.ofi-wrap{margin-bottom:18px}
.ofi-t{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.ofi-row{display:flex;gap:8px;flex-wrap:wrap}
.ofi-chip{min-width:150px;padding:8px 12px 9px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.02)}
.ofi-name{font-size:11.5px;color:var(--paper);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.ofi-monto{font-size:14.5px;font-weight:500;color:var(--p2,#c99148);line-height:1.15}
.ofi-sub{font-size:9.5px;letter-spacing:.6px;color:var(--faint);margin-top:3px}
.pres-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1100px}
.pres-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
.pres-col-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13.5px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.pres-col-n{color:var(--faint);font-size:12px}
.pres-enviado .pres-col-head{color:var(--paper)}
.pres-aprobado .pres-col-head{color:var(--today)}
.pres-caido .pres-col-head{color:var(--p1)}
.pres-cards{display:flex;flex-direction:column;gap:9px}
.pres-empty{color:var(--faint);font-size:12px;text-align:center;padding:14px 0}
.pres-card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 11px}
.pres-card:hover{border-color:var(--line-strong)}
.pres-nombre{font-size:13.5px;font-weight:500;line-height:1.35;outline:none}
.pres-nombre:focus{border-bottom:1px solid var(--line-strong)}
.pres-meta{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.3}
.pres-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;font-size:11px}
.pres-monto{color:var(--paper);font-weight:500;font-size:12.5px}
.edit-monto{cursor:pointer}
.edit-monto:hover{color:var(--today);text-decoration:underline dotted}
.pres-fecha{color:var(--faint)}
.pres-motivo{font-size:10.5px;color:var(--p1);margin-top:6px;line-height:1.35}
.pres-acts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.pa{font-family:'IBM Plex Mono',monospace;font-size:10px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--dim)}
.pa:hover{color:var(--paper);border-color:var(--line-strong)}
.pa.aprob:hover{color:var(--today);border-color:var(--today)}
.pa.caido:hover{color:var(--p1);border-color:var(--p1)}
.pa.edit{color:var(--paper);border-color:var(--line-strong)}
.pa.edit:hover{color:var(--today);border-color:var(--today)}
.pa.del{margin-left:auto}
.pa.del:hover{color:var(--p1)}

/* emisor de presupuestos — generador original embebido */
.emitir-view{max-width:none;display:flex;flex-direction:column;height:calc(100vh - 130px)}
.emit-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;flex-shrink:0}
.emit-bar-note{font-size:12px;color:var(--dim)}
.emit-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--today);color:var(--bg);border-radius:9px;padding:10px 16px;font-weight:500;white-space:nowrap}
.emit-btn:hover{opacity:.9}
.emit-frame{flex:1;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:500px}

/* ===== FINANZAS ===== */
.fin-view{max-width:1120px}
.fin-yrs{display:flex;gap:6px;margin-bottom:18px}
.fin-yb{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:7px 14px;background:var(--panel)}
.fin-yb:hover{border-color:var(--line-strong);color:var(--paper)}
.fin-yb.on{background:var(--panel-2);color:var(--paper);border-color:var(--today)}
.fin-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}
.fin-mc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.fin-mc .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.fin-mc .v{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;margin-top:6px;line-height:1}
.fin-mc.inc .v{color:var(--today)} .fin-mc.out .v{color:var(--p2)}
.fin-mc .v.pos{color:var(--today)} .fin-mc .v.neg{color:var(--p1)}
.fin-chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px 14px;margin-bottom:10px}
.fin-ch-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.fin-ch-t{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.fin-leg{display:flex;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim)}
.fin-leg b{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.fin-months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:170px}
.fin-mcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;border-radius:7px;
  padding:20px 2px 0;transition:background .12s;position:relative}
.fin-mval{position:absolute;top:4px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:9px;color:var(--today);white-space:nowrap;overflow:visible;pointer-events:none}
.fin-mcol:hover{background:var(--panel-2)}
.fin-mcol.on{background:var(--panel-2);outline:1px solid var(--line-strong)}
.fin-bars{display:flex;gap:3px;align-items:flex-end;height:100%;justify-content:center}
.fin-bars i{width:9px;border-radius:2px 2px 0 0;min-height:2px}
.fin-bars .bi{background:var(--today)} .fin-bars .bo{background:var(--p2)}
.fin-mlab{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);text-align:center;margin-top:7px}
.fin-mcol.on .fin-mlab{color:var(--paper)}
.fin-hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);text-align:center;margin:2px 0 24px}
.fin-det-h{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px}
.fin-det-h .dm{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:500;text-transform:capitalize}
.fin-det-h .dnet{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
.fin-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fin-ledger{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fin-lh{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.fin-lh .lt{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.fin-ledger.inc .lt{color:var(--today)} .fin-ledger.out .lt{color:var(--p2)}
.fin-lh .ltot{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500}
.fin-ledger.inc .ltot{color:var(--today)} .fin-ledger.out .ltot{color:var(--p2)}
.fin-item{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer;transition:background .12s}
.fin-item:hover{background:var(--panel-2)}
.fin-idate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);width:52px;flex-shrink:0;padding-top:2px}
.fin-ibody{flex:1;min-width:0}
.fin-iwho{font-size:13.5px;font-weight:500;line-height:1.3}
.fin-imeta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.fin-iconcept{font-size:12px;color:var(--dim)}
.fin-iproj{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint)}
.fin-cat{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.fin-cat.esp{color:#7fb2ab;border-color:#7fb2ab}
.fin-cat.soft{color:#9c7fb2;border-color:#9c7fb2}
.fin-cat.ofi{color:#c99148;border-color:#c99148}
.fin-cat.otro{color:#8a8378;border-color:#8a8378}
.fin-iamt{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;white-space:nowrap;padding-top:1px}
.fin-ledger.inc .fin-iamt{color:var(--today)} .fin-ledger.out .fin-iamt{color:var(--p2)}
.fin-add{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);width:100%;
  color:var(--today);font-size:12.5px;font-family:'IBM Plex Mono',monospace;text-align:left}
.fin-add:hover{background:var(--panel-2)}
.fin-empty{padding:22px 16px;color:var(--faint);font-size:12.5px;font-style:italic;text-align:center}
.fin-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);margin-top:22px;line-height:1.6;max-width:860px}
/* sin fecha */
.fin-und{border:1px solid var(--p2);border-radius:12px;padding:14px 16px;margin-bottom:18px;background:rgba(201,145,72,.06)}
.fin-und-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.fin-und-t{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--p2);letter-spacing:.3px}
.fin-und-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint)}
.fin-und-row{display:grid;grid-template-columns:64px 1.4fr 1.4fr 1fr auto;gap:10px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line)}
.fin-und-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;border:1px solid;text-align:center}
.fin-und-tag.in{color:var(--today);border-color:var(--today)}
.fin-und-tag.out{color:var(--p2);border-color:var(--p2)}
.fin-und-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-und-con{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-und-amt{font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right}
.fin-und-amt.in{color:var(--today)} .fin-und-amt.out{color:var(--p2)}
.fin-und-date{background:var(--bg);border:1px solid var(--line-strong);border-radius:7px;color:var(--paper);
  padding:6px 9px;font-size:12px;font-family:'IBM Plex Mono',monospace;color-scheme:dark;outline:none}
:root[data-theme="paper"] .fin-und-date{color-scheme:light}
.fin-und-date:focus{border-color:var(--today)}
@media(max-width:820px){.fin-und-row{grid-template-columns:1fr 1fr;gap:6px}}
.modal .f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:4px}
@media(max-width:820px){.fin-cols{grid-template-columns:1fr}.fin-sum{grid-template-columns:1fr}}

/* archivados */
.arch-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 34px 30px;padding:12px 14px;
  border:1px dashed var(--line-strong);border-radius:10px;background:var(--panel)}
.arch-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.arch-chip{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border:1px solid var(--line);
  border-radius:20px;background:var(--panel-2)}
.arch-chip .ac-name{font-size:12.5px;color:var(--dim);cursor:pointer}
.arch-chip .ac-name:hover{color:var(--paper)}
.arch-chip .ac-restore{color:var(--today);font-size:14px;line-height:1;width:22px;height:22px;border-radius:50%}
.arch-chip .ac-restore:hover{background:var(--panel)}
.arch-btn{color:var(--dim)!important;border:1px solid var(--line)!important}
.arch-btn:hover{color:var(--paper)!important;border-color:var(--line-strong)!important}

/* buscador */
.search-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;z-index:120;padding-top:12vh}
.search-box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.search-inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--paper);
  padding:16px 18px;font-size:16px;font-family:'IBM Plex Sans',sans-serif;outline:none}
.search-inp::placeholder{color:var(--faint)}
.search-list{max-height:52vh;overflow-y:auto;padding:6px}
.search-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer}
.search-row.on{background:var(--panel-2)}
.sr-name{font-size:14px;font-weight:500;color:var(--paper);flex-shrink:0}
.sr-meta{flex:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-ficha{color:var(--faint);font-size:13px;width:26px;height:26px;border-radius:6px;flex-shrink:0}
.sr-ficha:hover{color:var(--today);background:var(--panel)}
.search-empty{padding:20px;text-align:center;color:var(--faint);font-size:13px;font-style:italic}
.column.flash{animation:colflash 1.4s ease}
@keyframes colflash{0%,100%{box-shadow:none}20%,60%{box-shadow:0 0 0 2px var(--today)}}

/* vista archivados */
.arch-view{max-width:920px}
.arch-search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);padding:0 14px;margin-bottom:14px}
.arch-search .as-ico{color:var(--faint);font-size:15px}
.arch-search-inp{flex:1;background:transparent;border:none;color:var(--paper);padding:12px 0;font-size:14px;
  font-family:'IBM Plex Sans',sans-serif;outline:none}
.arch-search-inp::placeholder{color:var(--faint)}
.arch-tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arch-row{display:grid;grid-template-columns:2fr 1.2fr 1.2fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.arch-row:first-child{border-top:none}
.arch-row.h{background:var(--panel)}
.arch-row.h>span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.ar-name{font-size:14px;font-weight:500;color:var(--paper);cursor:pointer}
.ar-name:hover{color:var(--today)}
.ar-area{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.ar-cob{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--today)}
.ar-acts{display:flex;gap:8px;justify-content:flex-end}
.ar-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:7px;padding:7px 11px}
.ar-btn:hover{color:var(--paper);border-color:var(--line-strong)}
.ar-btn.restore{color:var(--today);border-color:var(--today)}
.ar-btn.restore:hover{background:var(--panel-2)}
.arch-empty{text-align:center;padding:60px 20px;max-width:520px;margin:0 auto}
.arch-empty .ae-ico{font-size:34px;color:var(--faint);margin-bottom:14px}
.arch-empty .ae-t{font-family:'Fraunces',Georgia,serif;font-size:20px;margin-bottom:8px}
.arch-empty .ae-s{font-size:13px;color:var(--dim);line-height:1.6}

/* ===== PERSONAL ===== */
.pers-view{max-width:920px}
.pers-add{display:grid;grid-template-columns:130px 96px 1.2fr 1.6fr 110px auto;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}
.pa-in{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--paper);
  padding:9px 10px;font-size:13px;outline:none;font-family:'IBM Plex Sans',sans-serif;color-scheme:dark;width:100%}
:root[data-theme="paper"] .pa-in{color-scheme:light}
.pa-in:focus{border-color:var(--line-strong)}
.pa-monto{font-family:'IBM Plex Mono',monospace;text-align:right}
.pa-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--today);color:var(--bg);
  border-radius:8px;padding:0 14px;font-weight:500;white-space:nowrap}
.pa-btn:hover{opacity:.9}
.pers-addcat{margin:8px 0 2px}
.pa-addcat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);border:1px dashed var(--line-strong);
  border-radius:7px;padding:6px 10px}
.pa-addcat:hover{color:var(--paper)}
.pers-body{margin-top:18px}
.pers-selbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pers-month{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:500;min-width:170px;text-transform:capitalize}
.pers-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:22px}
.pers-cats{display:flex;flex-direction:column;gap:11px;margin-bottom:6px}
.pcat-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.pcat-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pcat-name{font-size:13px;font-weight:500}
.pcat-amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
.pcat-bar{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.pcat-bar>i{display:block;height:100%;border-radius:5px;transition:width .3s}
.pers-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pers-item{display:grid;grid-template-columns:58px 130px 1fr auto 30px;gap:10px;align-items:center;
  padding:11px 14px;border-top:1px solid var(--line)}
.pers-item:first-child{border-top:none}
.pi-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.pi-cat{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;border:1px solid;justify-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.pi-desc{font-size:13px;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-amt{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--p2);text-align:right}
.pers-item.ing .pi-amt{color:var(--today)}
.pi-del{color:var(--faint);font-size:15px;width:26px;height:26px;border-radius:6px}
.pi-del:hover{color:var(--p1);background:var(--panel-2)}
.pers-empty{padding:20px 4px;color:var(--faint);font-size:13px;font-style:italic}
/* bandeja de movimientos del banco por clasificar */
.pers-triage{margin-bottom:6px}
.triage-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.015)}
.triage-info{display:flex;align-items:baseline;gap:10px;flex:1;min-width:250px}
.triage-fecha{color:var(--faint);font-size:11px}
.triage-desc{font-size:13px;flex:1}
.triage-monto{font-size:12.5px;color:var(--paper);font-weight:500}
.triage-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.triage-acts .pa-in{max-width:170px;font-size:11.5px;padding:5px 7px}
.pa-ign{background:none;border:1px solid var(--line);color:var(--faint);
  border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12px}
.pa-ign:hover{color:var(--p1);border-color:var(--p1)}
.triage-sug{width:100%;color:var(--faint);font-size:10.5px;font-style:italic;padding-left:2px}
.triage-n{color:var(--today);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.triage-sub{color:var(--faint);font-size:11px;margin:8px 0 4px 2px;letter-spacing:.4px}
.sin-proy{color:var(--p2,#c99148);font-size:9.5px;letter-spacing:.6px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:7px}
@media(max-width:820px){.pers-add{grid-template-columns:1fr 1fr}.pers-sum{grid-template-columns:1fr}.pers-item{grid-template-columns:50px 1fr auto 26px}.pi-cat{display:none}}

/* temporizador */
.timer-btn{color:var(--faint);font-size:10px}
.timer-btn:hover{color:var(--today)}
.timer-btn.on{color:var(--today)}
.pm-time{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;color:var(--dim)}
.pm-time .pmt-ic{opacity:.8}
.pm-time.live{color:var(--today)}
.tmr-modal .tmr-opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.tmr-opt{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line-strong);border-radius:9px;
  padding:11px 16px;color:var(--paper);background:var(--panel)}
.tmr-opt:hover{border-color:var(--today);background:var(--panel-2)}
.tmr-opt.wide{width:100%;text-align:left;color:var(--today)}
.tmr-widget{position:fixed;right:20px;bottom:20px;z-index:130;width:210px;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:14px;padding:14px 15px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.tmr-widget.done{border-color:var(--p1);animation:tmrpulse 1s ease infinite}
@keyframes tmrpulse{0%,100%{box-shadow:0 14px 40px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 2px var(--p1),0 14px 40px rgba(0,0,0,.4)}}
.tw-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tw-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.tw-dot.run{background:var(--today);box-shadow:0 0 0 3px color-mix(in srgb,var(--today) 25%,transparent)}
.tw-name{flex:1;font-size:12px;font-weight:500;color:var(--paper);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-name:hover{color:var(--today)}
.tw-x{color:var(--faint);font-size:12px;width:20px;height:20px;border-radius:5px;flex-shrink:0}
.tw-x:hover{color:var(--p1);background:var(--panel-2)}
.tw-time{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:38px;line-height:1;letter-spacing:-1px;color:var(--paper);text-align:center;margin:2px 0}
.tw-time.warn{color:var(--p2)}
.tmr-widget.done .tw-time{color:var(--p1)}
.tw-sub{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px}
.tw-ctr{display:flex;gap:7px}
.tw-btn{flex:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;border:1px solid var(--line);border-radius:8px;
  padding:8px 6px;color:var(--paper);background:var(--panel-2)}
.tw-btn:hover{border-color:var(--line-strong)}
.tw-btn.stop{color:var(--p1)}
.tw-btn.stop:hover{border-color:var(--p1)}

/* ===== TIEMPO ===== */
.time-view{max-width:920px}
.time-bars{display:flex;flex-direction:column;gap:12px}
.tbar-top{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.tbar-name{font-size:13px;font-weight:500;color:var(--paper)}
.tbar-h{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--today)}
.tbar-track{height:9px;background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.tbar-track>i{display:block;height:100%;background:var(--today);border-radius:5px;transition:width .3s}
.time-days{display:flex;align-items:flex-end;gap:3px;height:130px;padding:8px 0 0;border-bottom:1px solid var(--line)}
.tday{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.tday-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.tday-bar{width:70%;min-height:0;background:var(--line-strong);border-radius:2px 2px 0 0;transition:height .3s}
.tday.has .tday-bar{background:var(--today)}
.tday-n{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--faint)}
.time-hist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thist-row{display:grid;grid-template-columns:2fr 1.2fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.thist-row:first-child{border-top:none}
.thr-name{font-size:13px;font-weight:500;color:var(--paper)}
.thr-area{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.thr-h{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--today);text-align:right}
.edit-hrs{cursor:pointer}
.edit-hrs:hover{background:var(--panel)}
.dm-hint{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);font-style:italic}

/* ===== MARKETING ===== */
.mkt-view{max-width:960px}
.mkt-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.mkt-tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.mkt-tab{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);padding:8px 16px;border-radius:8px}
.mkt-tab.on{background:var(--panel-2);color:var(--paper)}
.mkt-new{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--today);color:var(--bg);border-radius:9px;padding:10px 16px;font-weight:500}
.mkt-new:hover{opacity:.9}
.mkt-filtros{display:flex;gap:6px;margin-bottom:14px}
.mkt-fbtn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.mkt-fbtn.on{background:var(--paper);color:var(--bg);border-color:var(--paper)}
.mkt-tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mkt-row{display:grid;grid-template-columns:90px 1fr 110px 110px 110px 34px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.mkt-row:first-child{border-top:none}
.mkt-row.h{background:var(--panel)}
.mkt-row.h>span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.mkt-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
.mkt-title{font-size:13px;font-weight:500;color:var(--paper);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-title:hover{color:var(--today)}
.mkt-marca{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:20px;color:var(--dim);white-space:nowrap}
.mkt-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 10px;border-radius:20px;white-space:nowrap;display:inline-block}
.mkt-del{color:var(--faint);font-size:15px;width:26px;height:26px;border-radius:6px}
.mkt-del:hover{color:var(--p1);background:var(--panel-2)}
/* kanban */
.mkt-kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mkt-lane{background:var(--panel);border-radius:12px;padding:10px;min-height:120px}
.mkt-lane-h{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.mkt-lane-n{margin-left:auto;color:var(--dim)}
.mkt-card{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:7px;cursor:pointer}
.mkt-card:hover{border-color:var(--line-strong)}
.mkt-card-t{font-size:12.5px;font-weight:500;color:var(--paper);margin-bottom:6px;line-height:1.3}
.mkt-card-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.mkt-card-f{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint)}
.mkt-card-p{display:flex;gap:5px}
.mkt-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 7px;border-radius:10px}
.mkt-tag.ig{background:#3a2836;color:#d98fa8}
.mkt-tag.li{background:#1f2f3a;color:#6d9ac9}
/* calendario */
.mkt-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mkt-cal-dow{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--faint);padding-bottom:4px}
.mkt-cal-cell{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mkt-cal-cell:hover{border-color:var(--line-strong)}
.mkt-cal-n{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint)}
.mkt-cal-posts{display:flex;flex-direction:column;gap:2px}
.mkt-cal-post{display:flex;align-items:center;gap:3px;background:var(--panel);border-radius:4px;padding:2px 4px}
.mkt-cal-txt{font-size:9px;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-cal-more{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--faint);padding-left:4px}
.dotp{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dotp.ig{background:#d98fa8}
.dotp.li{background:#6d9ac9}
.mkt-cal-leg{display:flex;gap:16px;margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);align-items:center}
.mkt-cal-leg span{display:flex;align-items:center;gap:5px}
.mkt-cal-hint{margin-left:auto;color:var(--faint);font-style:italic}
/* editor */
.mkt-modal{min-width:440px;max-width:460px}
.mkt-lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);display:block;margin:10px 0 4px}
.mkt-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mkt-marca-row{display:flex;gap:6px}
.mkt-marca-row select{flex:1}
.mkt-addmarca{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);border:1px dashed var(--line-strong);border-radius:7px;padding:0 10px;white-space:nowrap}
.mkt-addmarca:hover{color:var(--paper)}
@media(max-width:820px){.mkt-kanban{grid-template-columns:1fr 1fr}.mkt-2col{grid-template-columns:1fr}.mkt-modal{min-width:0;width:92vw}}

/* login + nube */
.login-ov{position:fixed;inset:0;background:var(--bg);z-index:200;display:grid;place-items:center}
.login-box{width:min(360px,90vw);display:flex;flex-direction:column;gap:12px;padding:8px}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-rc{width:46px;height:46px;border:1.5px solid var(--line-strong);border-radius:10px;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;color:var(--paper);background:var(--panel)}
.login-t{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--paper)}
.login-t small{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-top:2px;font-weight:400}
.login-sub{font-size:13px;color:var(--dim);margin-bottom:6px}
.login-in{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--paper);
  padding:12px 13px;font-size:14px;outline:none;font-family:'IBM Plex Sans',sans-serif}
.login-in:focus{border-color:var(--today)}
.login-btn{background:var(--today);color:var(--bg);border-radius:9px;padding:12px;font-family:'IBM Plex Mono',monospace;
  font-size:13px;font-weight:500;margin-top:4px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.6}
.login-err{color:var(--p1);font-size:12px;min-height:14px;font-family:'IBM Plex Mono',monospace}
.login-note{font-size:11px;color:var(--faint);font-family:'IBM Plex Mono',monospace;margin-top:8px;line-height:1.5}
.cloud-dot{position:fixed;left:18px;bottom:14px;z-index:90;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--faint);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.cloud-dot.show{opacity:1;transform:translateY(0)}
/* aviso fijo cuando el tablero NO está guardando en la nube: este no se
   esconde solo, porque perder tareas sin enterarse es lo peor que puede pasar */
.cloud-alerta{position:fixed;left:14px;bottom:12px;z-index:95;max-width:min(430px,92vw);
  font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.45;
  background:var(--panel);border:1px solid var(--p1);border-radius:10px;
  padding:9px 12px;color:var(--paper);cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.cloud-alerta b{color:var(--p1);font-weight:600}
.cloud-alerta small{display:block;color:var(--dim);font-size:10px;margin-top:3px}
@media(max-width:760px){ .cloud-alerta{left:8px;right:8px;bottom:8px;max-width:none} }
.ask-modal{min-width:340px}
.ask-in{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;color:var(--paper);
  padding:12px 13px;font-size:14px;outline:none;font-family:'IBM Plex Sans',sans-serif;margin:4px 0 6px}
.ask-in:focus{border-color:var(--today)}

/* login + nube */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ================= TELÉFONO ================= */
#navBtn{display:none}
@media(max-width:760px){
  /* En el teléfono la página entera hace scroll, en vez de paneles de altura fija */
  html,body{height:auto;overflow-x:hidden;overflow-y:auto}
  /* min-width:0 / minmax(0,1fr) en toda la cadena: sin esto, la rejilla y los
     flex se ensanchan hasta el ancho del tablero completo (unos 2000px) y
     entonces .board-scroll nunca tiene sobrante que desplazar: el tablero se
     sale de la pantalla y el dedo no encuentra nada que mover. */
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto;min-height:100vh;overflow:visible}
  #main{height:auto;overflow:visible;min-height:0;min-width:0;max-width:100vw}
  #mainContent{flex:none!important;min-height:0;overflow:visible!important;
    min-width:0;max-width:100vw;
    padding-left:16px!important;padding-right:16px!important}
  .today-view,.pers-view,.fin-view{flex:none;overflow-y:visible;min-width:0;max-width:100%;padding:4px 0 40px}
  .board-scroll{flex:none;height:auto;overflow-y:visible;overflow-x:auto;
    -webkit-overflow-scrolling:touch;padding:6px 0 20px;
    min-width:0;max-width:100%;
    touch-action:pan-x pan-y;overscroll-behavior-x:contain}
  .mkt-tbl{touch-action:pan-x pan-y;min-width:0;max-width:100%;overflow-x:auto}
  .board,.board.packed,.lane,.column,.cards,.card{touch-action:pan-x pan-y}
  .card{-webkit-user-drag:none;user-select:none}
  .board,.board.packed{height:auto}
  .nav-arrow{display:none}          /* las flechas estorban en pantalla chica */

  /* barra lateral como cajón */
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:255px;z-index:120;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 40px rgba(0,0,0,.5);overflow-y:auto}
  body.nav-open #sidebar{transform:none}
  body.nav-open::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:110}
  #navBtn{display:flex;align-items:center;justify-content:center;
    position:fixed;top:10px;left:10px;z-index:130;width:38px;height:38px;
    border:1px solid var(--line);border-radius:9px;background:var(--sidebar);
    color:var(--paper);font-size:17px;cursor:pointer}

  .topbar{flex-direction:column;align-items:flex-start;gap:10px;padding:56px 16px 12px}
  .topbar .title-wrap h1{font-size:26px}
  .clock-wrap{display:flex;align-items:baseline;gap:9px}
  .clock-wrap .date-big{font-size:20px}
  .topbar-actions{margin-left:0;flex-wrap:wrap}

  /* una columna por pantalla, se deslizan de lado */
  .board.packed .lane,.board.packed .column,.column{width:86vw!important;min-width:86vw;max-height:none}
  .arch-strip{margin:8px 0 40px;padding:10px 12px}

  .pres-board,.pers-sum,.fin-sum,.fin-cols,.mkt-kanban{grid-template-columns:1fr}

  /* ---- Gráfico del año en pantalla chica ----
     minmax(0,1fr): sin esto cada mes exige su ancho mínimo, las 12 columnas
     suman más que la pantalla y diciembre queda fuera del borde.
     Los montos van en vertical sobre la barra para que no se encimen. */
  .fin-chart{padding:16px 10px 12px}
  .fin-ch-h{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:12px}
  .fin-months{grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;height:320px}
  .fin-mcol{padding:104px 0 0;border-radius:5px}
  .fin-bars{gap:2px}
  .fin-bars i{width:7px;border-radius:2px 2px 0 0}
  .fin-mlab{font-size:9px;margin-top:6px}
  .fin-mval{top:4px;left:50%;right:auto;height:98px;width:12px;margin-left:-6px;
    writing-mode:vertical-rl;transform:rotate(180deg);
    display:flex;align-items:flex-start;justify-content:center;
    font-size:8.5px;letter-spacing:-.2px;text-align:left}
  .pers-add{grid-template-columns:1fr 1fr}
  .mkt-tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mkt-row{min-width:610px}
  .platabar .pchip{flex:1 1 30%;padding:5px 8px 6px}
  .platabar .pchip .pv{font-size:12.5px}
  .ofi-chip{flex:1 1 45%;min-width:0}
  .ofi-name{max-width:100%}
  .emit-frame{height:74vh}
  .triage-row{flex-direction:column;align-items:stretch}
  .triage-acts{flex-wrap:wrap}
  .triage-acts .pa-in{flex:1 1 45%;max-width:none}
  .modal{width:94vw;max-width:94vw}
  .tmr-widget{right:10px;bottom:10px;width:170px}
}
</style>
</head>
<body>

<div id="app">

  <main id="main">

          <button class="fit" title="Ajustar todo a la pantalla" onclick="zoomFit()">⤢</button>

        <button class="icon-btn" id="layoutToggle" title="Alternar vista: empaquetado / columnas" onclick="toggleLayout()">▦</button>
        <button class="icon-btn" id="doneToggle" title="Mostrar / ocultar completadas" onclick="toggleDone()">◍</button>

<script>
"use strict";

/* ============ ESTADO ============ */
const KEY = 'rc_todo_v1';
let data = null;
let DRAG = null;
const uid = () => Math.random().toString(36).slice(2,9);

function seed(){
  const col = (name, tasks) => ({ id:uid(), name, tasks: tasks.map(t => ({
    id:uid(), text:(typeof t==='string'?t:t.text), done:false,
    priority:(t.p||0), due:(t.due||null)
  })) });
  const today = new Date().toISOString().slice(0,10);
  return {
    ui:{ currentAreaId:null, view:'board', theme:'dark', hideDone:true, zoom:1, layout:'packed' },
    areas:[
      { id:uid(), name:'EMEP', kind:'board', columns:[
        col('Casa Marbella 2518',[
          'poner detalle de mapa',
          {text:'Faltan los ventiladores en clima, siempre van los ventiladores',p:2},
          'En subterráneo va 1 caldera y 2 calefones, la caldera es para clima y para el ACS del subterráneo',
          'colocar planta de aguas grises',
          'alturas reales de cámaras',
          'dejar ficha de planta de aguas grises',
          'isométrica alcantarillado',
          'agregar circuito de piscina, siempre lleva una bomba o algo',
        ]),
        col('Colbun 2432',[
          'agregar detalles eléctricos',
          {text:'Faltan etiquetas y dimensión de radiadores clima calor según cálculo',p:1},
          'faltan etiquetas de aires acondicionados según cálculo',
          'Encender baños en CC de clima',
          'tubos de electricidad living y cocina que no se vean',
          'revisar 3D eléctrico para ajustar tubos y chalupas que falten',
          'tubos de clima que pasan por escalera',
          'Revisar y mover tubos que choquen en el 3D',
          {text:'Mandar un video a Eduardo — para que vea lo que falta',p:2},
          'muro de hormigón',
          'detalle de escalera 2',
        ]),
        col('gimnasio Talca',[
          'conseguir puertas bonitas de salida',
          'conseguir aro de básquetbol',
        ]),
        col('Casa 2505 SEREMI',[
          {text:'Hay entrega nueva de agua, revisar observaciones',p:1,due:today},
        ]),
        col('Casa Puerto Varas 2435',[
          {text:'Hacer modificaciones pedidas por Sofía',due:today},
        ]),
        col('2510 la minga',[
          'Agregar llaves de paso',
          'Revisar algunas ventanas',
          'Prender capa para que se vean más artefactos caliente y fría',
          'Caldera debe aparecer agua caliente y fría en todos lados',
          'Ver eléctrico que es de paneles solares, pegar cálculo y notas',
        ]),
      ]},
      { id:uid(), name:'the XR agency', kind:'board', columns:[
        col('Pendientes',[]),
      ]},
      { id:uid(), name:'The arq market', kind:'board', columns:[
        col('Bioma precordillera (UE5.8)',[
          'Terreno con Landscape',
          'Foliage PCG: espinos, quillayes, peumos',
          'Materiales del terreno por capas',
        ]),
        col('Pendientes',[]),
      ]},
      { id:uid(), name:'Propertwin', kind:'board', columns:[
        col('Mapa CesiumJS',[
          'Agregar edificios no construidos al mapa para inmobiliarias',
        ]),
        col('Tour interior',[
          'Pipeline ArchiCAD → FBX → Shapespark',
        ]),
        col('Pendientes',[
          'Suscripciones recurrentes con Flow',
        ]),
      ]},
    ],
    inbox:[],
  };
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ data = JSON.parse(raw); }
  }catch(e){ data = null; }
  if(!data || !data.areas){ data = seed(); }
  normalizeData();
}
function normalizeData(){
  if(!data.inbox) data.inbox = [];
  if(!data.ui) data.ui = { currentAreaId:null, view:'board', theme:'dark', hideDone:true, zoom:1 };
  if(!data.ui.zoom) data.ui.zoom = 1;
  if(!data.ui.layout) data.ui.layout = 'packed';
  if(!data.ui.currentAreaId && data.areas[0]) data.ui.currentAreaId = data.areas[0].id;
  data.areas.forEach(a=>a.columns.forEach(c=>{
    if(!c.meta) c.meta={anticipo:null,revA:null,revB:null,rev0:null,team:{}};
    if(!c.meta.team) c.meta.team={};
    if(!c.meta.fin) c.meta.fin={presupuesto:0,cobrado:0,pagosList:[]};
    if(!c.meta.fin.pagosList){
      c.meta.fin.pagosList=[];
      if(c.meta.fin.pagos){ Object.keys(c.meta.fin.pagos).forEach(k=>{ if(c.meta.fin.pagos[k]>0) c.meta.fin.pagosList.push({id:Math.random().toString(36).slice(2,9),fecha:null,especialidad:k,monto:c.meta.fin.pagos[k]}); }); }
    }
  }));
  if(!data.equipo) data.equipo=['Eduardo','Mathias Cristie','Osvaldo Fredes','Marco Riveros','Juan Ventura','Emilia Rojas'];
  if(!data.presupuestos) data.presupuestos=[];
  if(!data.ingresosGenerales) data.ingresosGenerales=[];
  if(!data.gastosGenerales) data.gastosGenerales=[];
  ensurePersonal();
  if(!('timer' in data.ui)) data.ui.timer=null;
  if(!data.timeLog) data.timeLog=[];
  if(!data.mkt) data.mkt={ posts:[], marcas:['EMEP','IEN','Molde','Propertwin','theARQmarket'] };
  if(!data.mkt.posts) data.mkt.posts=[];
  if(!data.mkt.marcas || !data.mkt.marcas.length) data.mkt.marcas=['EMEP','IEN','Molde','Propertwin','theARQmarket'];
}
let saveTimer=null;
/* Marca "tengo cambios que todavía no confirmó la nube". Sobrevive a recargas,
   que es justo cuando se perdían tareas: escribías, el guardado en la nube
   fallaba en silencio, recargabas y la copia de la nube pisaba la local. */
const PEND_KEY='rc_pendiente_v1';
function marcarPendiente(){
  try{ localStorage.setItem(PEND_KEY, String(Date.now())); }catch(e){}
}
function pendienteDesde(){
  try{ const v=localStorage.getItem(PEND_KEY); return v?+v:0; }catch(e){ return 0; }
}
function limpiarPendiente(){ try{ localStorage.removeItem(PEND_KEY); }catch(e){} }

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
    marcarPendiente();
    cloudPush();                 // guarda en Supabase (si hay sesión)
  },250);
}

/* ============ ARCHIVO VINCULADO (File System Access) ============ */
let fileHandle=null;
const idb={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('rc_fs',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readonly'); const rq=tx.objectStore('kv').get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); },
  async del(k){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
};
function fileBtn(state){
  const b=document.getElementById('fileLinkBtn'); if(!b) return;
  if(state==='on'){ b.textContent='◈ Archivo vinculado'; b.style.color='var(--today)'; b.style.borderColor='var(--today)'; }
  else { b.textContent='◈ Vincular archivo'; b.style.color=''; b.style.borderColor=''; }
}
async function linkFile(){
  if(!window.showSaveFilePicker){ alert('Tu versión no soporta archivos. Usa Copiar/Pegar JSON.'); return; }
  if(fileHandle){
    if(confirm('Ya hay un archivo vinculado. ¿Desvincular?')){ fileHandle=null; await idb.del('handle'); fileBtn('off'); }
    return;
  }
  try{
    const existing=confirm('¿Ya tienes un rc-tablero.json?\n\nAceptar = abrir el existente (carga sus datos)\nCancelar = crear uno nuevo con el tablero actual');
    if(existing){
      const [h]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      fileHandle=h;
      const f=await h.getFile(); const txt=await f.text();
      try{ const d=JSON.parse(txt); if(d&&d.areas){ data=d; if(!data.inbox)data.inbox=[]; if(!data.ui)data.ui={theme:'dark',hideDone:true,view:'board',currentAreaId:null,zoom:1}; if(!data.ui.zoom)data.ui.zoom=1; if(!data.ui.currentAreaId)data.ui.currentAreaId=data.areas[0]&&data.areas[0].id; } }catch(_){ alert('El archivo no tiene un tablero válido; se mantiene el actual y se sobrescribirá al guardar.'); }
    } else {
      fileHandle=await window.showSaveFilePicker({suggestedName:'rc-tablero.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    }
    await idb.set('handle',fileHandle);
    fileBtn('on'); render(); writeToFile();
  }catch(e){ /* usuario canceló */ }
}
let writing=false, lastKnownMod=0;
async function writeToFile(){
  if(!fileHandle||writing) return;
  writing=true;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(data,null,2));
    await w.close();
    try{ const f=await fileHandle.getFile(); lastKnownMod=f.lastModified; }catch(_){}
  }catch(e){ /* permiso revocado u otro problema: sigue el respaldo en localStorage */ }
  writing=false;
}
function isEditing(){
  const ae=document.activeElement;
  return !!(ae && (ae.isContentEditable || ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT'&&ae.type!=='button')));
}
async function checkExternalChange(){
  if(!fileHandle||writing||isEditing()) return;
  if(document.querySelector('.modal-ov')) return;      // no recargar con la ficha abierta
  try{
    const f=await fileHandle.getFile();
    if(f.lastModified<=lastKnownMod) return;            // no hay novedad
    const d=JSON.parse(await f.text());
    if(!(d&&d.areas)) return;
    lastKnownMod=f.lastModified;
    const ui=data&&data.ui;                              // conserva vista/zoom/tema locales
    data=d;
    if(!data.inbox)data.inbox=[];
    if(!data.ui)data.ui={theme:'dark',hideDone:true,view:'board',currentAreaId:null,zoom:1};
    if(ui){ data.ui.view=ui.view; data.ui.zoom=ui.zoom; data.ui.theme=ui.theme; data.ui.hideDone=ui.hideDone;
      if(data.areas.some(a=>a.id===ui.currentAreaId)) data.ui.currentAreaId=ui.currentAreaId; }
    if(!data.ui.currentAreaId)data.ui.currentAreaId=data.areas[0]&&data.areas[0].id;
    data.areas.forEach(a=>a.columns.forEach(c=>{ if(!c.meta)c.meta={anticipo:null,revA:null,revB:null,rev0:null,team:{}}; if(!c.meta.team)c.meta.team={}; }));
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(_){}
    render();
  }catch(e){}
}
window.addEventListener('focus', checkExternalChange);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkExternalChange(); });
setInterval(checkExternalChange, 30000);
async function restoreFile(){
  if(!window.showSaveFilePicker) return;
  try{
    const h=await idb.get('handle'); if(!h) return;
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted' || (await h.requestPermission({mode:'readwrite'}))==='granted'){
      fileHandle=h; fileBtn('on');
      try{
        const f=await h.getFile(); lastKnownMod=f.lastModified;
        const d=JSON.parse(await f.text());
        if(d&&d.areas){ data=d; if(!data.inbox)data.inbox=[]; if(!data.ui.zoom)data.ui.zoom=1; render(); }
      }catch(_){}
    }
  }catch(e){}
}

/* ============ HELPERS ============ */
function el(tag, attrs={}, ...kids){
  const n=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') n.className=attrs[k];
    else if(k==='text') n.textContent=attrs[k];
    else if(k.startsWith('on')&&typeof attrs[k]==='function') n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==false&&attrs[k]!=null) n.setAttribute(k,attrs[k]);
  }
  for(const c of kids){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
}
function curArea(){ return data.areas.find(a=>a.id===data.ui.currentAreaId); }
function allTasks(){
  const out=[];
  data.areas.forEach(a=>a.columns.forEach(c=>{ if(c.archived) return; c.tasks.forEach(t=>out.push({t,area:a,col:c})); }));
  data.inbox.forEach(t=>out.push({t,area:{name:'Bandeja'},col:null}));
  return out;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDue(iso){
  if(!iso) return null;
  const d=new Date(iso+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((d-now)/86400000);
  let cls='', label;
  if(diff<0){ cls='overdue'; label=Math.abs(diff)+'d atraso'; }
  else if(diff===0){ cls='today'; label='Hoy'; }
  else if(diff===1){ label='Mañana'; }
  else label=d.toLocaleDateString('es-CL',{day:'numeric',month:'short'});
  return {cls,label};
}

/* ============ RENDER ============ */
function render(){
  document.documentElement.setAttribute('data-theme', data.ui.theme);
  document.getElementById('themeToggle').textContent = data.ui.theme==='dark'?'☾':'☀';
  document.getElementById('doneToggle').style.opacity = data.ui.hideDone?'.55':'1';
  const zv=document.getElementById('zoomVal'); if(zv) zv.textContent=Math.round((data.ui.zoom||1)*100)+'%';
  const lt=document.getElementById('layoutToggle'); if(lt){ const packed=(data.ui.layout||'packed')==='packed'; lt.textContent=packed?'▦':'▤'; lt.title=packed?'Vista empaquetada (clic: columnas)':'Vista columnas (clic: empaquetado)'; }
  renderSidebar();
  renderTop();
  renderMain();
  ensureTimerWidget();
  save();
}

function renderSidebar(){
  // nav active
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>{
    b.classList.toggle('active', data.ui.view===b.dataset.view);
  });
  const pending = t=>!t.done;
  document.getElementById('hoyCount').textContent = allTasks().filter(x=>x.t.due&&!x.t.done&&x.t.due<=todayStr()).length || '';
  document.getElementById('inboxCount').textContent = data.inbox.filter(pending).length || '';

/* ===== Franja de plata: qué tengo por cobrar, hoy ===== */
function renderPlataBar(){
  const bar=document.getElementById('plataBar');
  if(!bar) return;
  bar.innerHTML='';
  // solo en el tablero de un área
  if(data.ui.view!=='board'){ bar.style.display='none'; return; }
  const a=curArea(); if(!a){ bar.style.display='none'; return; }
  bar.style.display='';

  let porCobrar=0, presu=0, cobrado=0;
  let sinAnticipo=0, sinAnticipoMonto=0, nProy=0;
  a.columns.forEach(c=>{
    const fin=(c.meta&&c.meta.fin)||{};
    const p=fin.presupuesto||0;
    if(!p) return;
    nProy++;
    const lista=fin.pagosList||[];
    const cob=lista.length ? lista.reduce((s,x)=>s+(x.monto||0),0) : (fin.cobrado||0);
    presu+=p; cobrado+=cob;
    porCobrar+=Math.max(0,p-cob);
    // aprobado pero sin un peso pagado = estás trabajando gratis por ahora
    if(cob<=0){ sinAnticipo++; sinAnticipoMonto+=p; }
  });
  if(!nProy){ bar.style.display='none'; return; }

  const pct = presu? Math.round(cobrado/presu*100) : 0;
  const chip=(clase,valor,etiqueta,title)=>el('div',{class:'pchip '+clase,title:title||''},
    el('span',{class:'pv mono',text:valor}), el('span',{class:'pl',text:etiqueta}));

  bar.append(
    chip('pc-cobrar', clp(porCobrar), 'por cobrar',
      'Suma de lo que falta pagarte en '+nProy+' proyecto'+(nProy===1?'':'s')+' con presupuesto cargado'),
    chip('pc-riesgo', clp(sinAnticipoMonto), sinAnticipo+' sin anticipo',
      'Proyectos aprobados donde todavía no te pagan nada'),
    chip('pc-ok', clp(cobrado)+' · '+pct+'%', 'cobrado',
      'De un total presupuestado de '+clp(presu))
  );
}
